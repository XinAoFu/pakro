name: release-plz

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: release-plz

env:
  PAKRO_ENABLE_RELEASE: ${{ vars.PAKRO_ENABLE_RELEASE || 'false' }}
  PAKRO_RELEASE_REPOSITORY: ${{ github.repository }}
  PAKRO_DOWNLOAD_BASE_URL: ${{ vars.PAKRO_DOWNLOAD_BASE_URL }}
  PAKRO_R2_ENDPOINT_URL: ${{ vars.PAKRO_R2_ENDPOINT_URL }}
  PAKRO_RELEASE_BUCKET: ${{ vars.PAKRO_RELEASE_BUCKET }}
  PAKRO_CLOUDFLARE_ACCOUNT_ID: ${{ vars.PAKRO_CLOUDFLARE_ACCOUNT_ID }}
  PAKRO_CLOUDFLARE_WORKER_NAME: ${{ vars.PAKRO_CLOUDFLARE_WORKER_NAME }}
  PAKRO_CLOUDFLARE_ZONES: ${{ vars.PAKRO_CLOUDFLARE_ZONES }}
  PAKRO_GPG_SIGNING_KEY: ${{ vars.PAKRO_GPG_SIGNING_KEY }}
  PAKRO_RELEASE_NAME: ${{ vars.PAKRO_RELEASE_NAME }}
  PAKRO_RELEASE_EMAIL: ${{ vars.PAKRO_RELEASE_EMAIL }}
  MBX_DISABLE: "1"
  PAKRO_EXPERIMENTAL: 1
  NPM_CONFIG_FUND: false
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # The all-features debug build gets SIGKILLed (out of memory) on this runner.
  # These builds only run tasks and are never debugged, so skip debuginfo.
  CARGO_PROFILE_DEV_DEBUG: 0
  GITHUB_TOKEN: ${{ secrets.PAKRO_GH_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  release-plz:
    if: ${{ vars.PAKRO_ENABLE_RELEASE == 'true' && github.repository != 'jdx/mise' }}
    timeout-minutes: 80
    # Release builds must never restore or save persistent caches.
    runs-on: namespace-profile-endev-linux-amd64
    permissions:
      pull-requests: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAKRO_GH_TOKEN }}
      - uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.PAKRO_GPG_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
      - run: mkdir -p "$HOME/bin" && echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: cargo build --all-features --ignore-rust-version && cp target/debug/pakro "$HOME"/bin
      - uses: ./.github/actions/pakro-tools
        with:
          cache: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: crates-io-auth
      - run: pakro run release-plz
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          # render tasks rebuild pakro after bumping its version. Allow that nested
          # build to use dependencies whose rust-version metadata exceeds our MSRV.
          PAKRO_CARGO_BUILD_COMMAND: cargo build
          PAKRO_CARGO_BUILD_EXTRA_ARGS: --ignore-rust-version
          # The full-feature build above already covers compilation. Avoid HK's
          # redundant cargo-check, which enforces dependency rust-version metadata.
          HK_SKIP_STEPS: cargo-check
