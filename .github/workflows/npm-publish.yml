name: npm-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no actual publish)"
        required: false
        default: true
        type: boolean
      version:
        description: "Version to publish (e.g., v2026.1.1). Defaults to latest release."
        required: false
        type: string

concurrency:
  group: npm-publish-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}

env:
  PAKRO_ENABLE_RELEASE: ${{ vars.PAKRO_ENABLE_RELEASE || 'false' }}
  PAKRO_RELEASE_REPOSITORY: ${{ github.repository }}
  PAKRO_DOWNLOAD_BASE_URL: ${{ vars.PAKRO_DOWNLOAD_BASE_URL }}
  PAKRO_R2_ENDPOINT_URL: ${{ vars.PAKRO_R2_ENDPOINT_URL }}
  PAKRO_RELEASE_BUCKET: ${{ vars.PAKRO_RELEASE_BUCKET }}
  PAKRO_CLOUDFLARE_ACCOUNT_ID: ${{ vars.PAKRO_CLOUDFLARE_ACCOUNT_ID }}
  PAKRO_CLOUDFLARE_WORKER_NAME: ${{ vars.PAKRO_CLOUDFLARE_WORKER_NAME }}
  PAKRO_CLOUDFLARE_ZONES: ${{ vars.PAKRO_CLOUDFLARE_ZONES }}
  PAKRO_GPG_SIGNING_KEY: ${{ vars.PAKRO_GPG_SIGNING_KEY }}
  PAKRO_RELEASE_NAME: ${{ vars.PAKRO_RELEASE_NAME }}
  PAKRO_NPM_PREFIX: ${{ vars.PAKRO_NPM_PREFIX }}
  PAKRO_RELEASE_EMAIL: ${{ vars.PAKRO_RELEASE_EMAIL }}
  DRY_RUN: ${{ github.event_name == 'release' && '0' || (inputs.dry_run && '1' || '0') }}

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    if: ${{ vars.PAKRO_ENABLE_RELEASE == 'true' && github.repository != 'jdx/mise' && ((github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease) || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            # Validate the dispatch input against a strict release-tag pattern
            # before using it in shell paths or as a download key.
            if ! [[ "$INPUT_VERSION" =~ ^v[0-9][0-9A-Za-z._+-]*$ ]]; then
              echo "::error::Invalid version input: $INPUT_VERSION" >&2
              exit 1
            fi
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(./packaging/scripts/get-version.sh)"
          fi
          mkdir -p "releases/$VERSION"

          # Download release artifacts from GitHub release
          gh release download "$VERSION" \
            --repo "$REPOSITORY" \
            --dir "releases/$VERSION" \
            --pattern "pakro-*.tar.gz" \
            --pattern "pakro-*.tar.xz" || {
              echo "Failed to download release artifacts"
              exit 1
            }

          # Also download to releases/ directory for compatibility
          cp "releases/$VERSION"/pakro-*.tar.gz releases/ || true
          cp "releases/$VERSION"/pakro-*.tar.xz releases/ || true

      - name: Setup Node.js
        # `actions/setup-node` writes the npm registry URL and `NODE_AUTH_TOKEN`
        # auth into ~/.npmrc — aube reads the same file when it PUTs the
        # tarball, so this step is still needed even though npm itself is not
        # the publish client.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: ./.github/actions/pakro-tools
        with:
          cache: false

      - name: Install aube via pakro
        # aube comes from this repo's `pakro.toml` -> `runtimes/registry/aube.toml`
        # (-> `github:endevco/aube`). Same install path local devs see when
        # they run `pakro install`. aube signs SLSA provenance via the
        # Sigstore public-good instance using the workflow's
        # `id-token: write` permission, the same way `npm publish
        # --provenance` does.
        run: pakro install aube

      - name: Publish npm packages
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ ${DRY_RUN:-0} != 1 ]]; then
            if [[ -n "$INPUT_VERSION" ]]; then
              if ! [[ "$INPUT_VERSION" =~ ^v[0-9][0-9A-Za-z._+-]*$ ]]; then
                echo "::error::Invalid version input: $INPUT_VERSION" >&2
                exit 1
              fi
              PAKRO_VERSION="$INPUT_VERSION"
            else
              PAKRO_VERSION="$(./packaging/scripts/get-version.sh)"
            fi
            export PAKRO_VERSION
            export RELEASE_DIR="releases"
            NPM_PREFIX="${PAKRO_NPM_PREFIX:?Set PAKRO_NPM_PREFIX}" pakro x aube -- ./packaging/scripts/release-npm.sh
            NPM_PREFIX=pakro NPM_PLATFORM_PREFIX="$PAKRO_NPM_PREFIX" PUBLISH_PLATFORM_PACKAGES=0 pakro x aube -- ./packaging/scripts/release-npm.sh
          else
            echo "DRY RUN: Would publish npm packages"
          fi
