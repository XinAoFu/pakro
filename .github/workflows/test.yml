name: test

on:
  push:
    tags: ["v*"]
    branches: ["main", "pakro", "release"]
  pull_request:
    # Stacked PRs need the same platform checks before their base reaches main.
    branches: ["main", "codex/**"]
  workflow_dispatch:
  workflow_call:
    secrets:
      FORGEJO_TOKEN:
        required: false
      PAKRO_GH_TOKEN:
        required: false
      PAKRO_VERSIONS_API_SECRET:
        required: false

permissions: {}

jobs:
  trusted:
    if: ${{ vars.PAKRO_ENABLE_TRUSTED_RUNNERS == 'true' && github.actor == github.repository_owner && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)) }}
    permissions:
      contents: read
    uses: $/.github/workflows/test-impl.yml
    with:
      trusted: true
    secrets:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      PAKRO_GH_TOKEN: ${{ secrets.PAKRO_GH_TOKEN }}
      PAKRO_VERSIONS_API_SECRET: ${{ secrets.PAKRO_VERSIONS_API_SECRET }}

  untrusted:
    if: ${{ vars.PAKRO_ENABLE_TRUSTED_RUNNERS != 'true' || github.actor != github.repository_owner || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login != github.repository_owner)) }}
    permissions:
      contents: read
    uses: $/.github/workflows/test-impl.yml
    with:
      trusted: false

  test-ci:
    name: test-ci
    if: ${{ always() && !cancelled() && needs.trusted.result != 'cancelled' && needs.untrusted.result != 'cancelled' }}
    permissions: {}
    needs: [trusted, untrusted]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check selected workflow result
        env:
          TRUSTED_RESULT: ${{ needs.trusted.result }}
          UNTRUSTED_RESULT: ${{ needs.untrusted.result }}
        run: |
          if [[ "$TRUSTED_RESULT" == success && "$UNTRUSTED_RESULT" == skipped ]] ||
             [[ "$TRUSTED_RESULT" == skipped && "$UNTRUSTED_RESULT" == success ]]; then
            exit 0
          fi
          echo "trusted=$TRUSTED_RESULT untrusted=$UNTRUSTED_RESULT"
          exit 1
