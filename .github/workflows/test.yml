name: check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check to run explicitly
        type: choice
        options: [build, unit, e2e]
        default: build
      e2e_test:
        description: E2E path relative to tests/e2e (required for e2e)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 10
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CHECK_MODE: ${{ inputs.mode }}
      E2E_TEST: ${{ inputs.e2e_test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run requested check directly
        shell: bash
        run: |
          set -euo pipefail
          case "$CHECK_MODE" in
            build) cargo build --all-features ;;
            unit) cargo test --workspace --all-features ;;
            e2e)
              test -n "$E2E_TEST" || { echo 'Select a retained E2E test'; exit 2; }
              cargo build --all-features
              bash tests/e2e/run_test "$E2E_TEST"
              ;;
            *) echo 'Unsupported check mode'; exit 2 ;;
          esac
