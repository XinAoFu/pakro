name: release-alpine

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no actual changes)"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-alpine-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}

env:
  PAKRO_ENABLE_RELEASE: ${{ vars.PAKRO_ENABLE_RELEASE || 'false' }}
  PAKRO_RELEASE_REPOSITORY: ${{ github.repository }}
  PAKRO_DOWNLOAD_BASE_URL: ${{ vars.PAKRO_DOWNLOAD_BASE_URL }}
  PAKRO_R2_ENDPOINT_URL: ${{ vars.PAKRO_R2_ENDPOINT_URL }}
  PAKRO_RELEASE_BUCKET: ${{ vars.PAKRO_RELEASE_BUCKET }}
  PAKRO_CLOUDFLARE_ACCOUNT_ID: ${{ vars.PAKRO_CLOUDFLARE_ACCOUNT_ID }}
  PAKRO_CLOUDFLARE_WORKER_NAME: ${{ vars.PAKRO_CLOUDFLARE_WORKER_NAME }}
  PAKRO_CLOUDFLARE_ZONES: ${{ vars.PAKRO_CLOUDFLARE_ZONES }}
  PAKRO_GPG_SIGNING_KEY: ${{ vars.PAKRO_GPG_SIGNING_KEY }}
  PAKRO_RELEASE_NAME: ${{ vars.PAKRO_RELEASE_NAME }}
  PAKRO_RELEASE_EMAIL: ${{ vars.PAKRO_RELEASE_EMAIL }}
  # `github.event.inputs` values are always strings, so the string "false" was
  # truthy and pinned this to dry-run. The `inputs` context honors `type: boolean`.
  DRY_RUN: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && '0' || '1' }}
  GITHUB_API_TOKEN: ${{ secrets.PAKRO_GH_TOKEN || secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.PAKRO_GH_TOKEN || secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.PAKRO_GH_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  bump-alpine:
    runs-on: ubuntu-latest
    container: ghcr.io/jdx/mise:alpine@sha256:9193f04d9f786a0fcad5cf80c0fb2752605af4fff0bd452766d12ad0217c3b57
    timeout-minutes: 60
    if: ${{ vars.PAKRO_ENABLE_RELEASE == 'true' && github.repository != 'jdx/mise' && ((github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && endsWith(github.event.release.tag_name, '0')) || (github.event_name == 'workflow_dispatch')) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Bump APKBUILD
        run: sudo -Eu packager ./packaging/scripts/release-alpine.sh
        env:
          ALPINE_GITLAB_FORK: ${{ vars.ALPINE_GITLAB_FORK }}
          ALPINE_BACKUP_REPO: ${{ vars.ALPINE_BACKUP_REPO }}
          ALPINE_GITLAB_TOKEN: ${{ secrets.ALPINE_GITLAB_TOKEN }}
          ALPINE_GITLAB_SSH_KEY: ${{ secrets.ALPINE_GITLAB_SSH_KEY }}
          ALPINE_KEY_ID: ${{ secrets.ALPINE_KEY_ID }}
          ALPINE_PRIV_KEY: ${{ secrets.ALPINE_PRIV_KEY }}
          ALPINE_PUB_KEY: ${{ secrets.ALPINE_PUB_KEY }}
