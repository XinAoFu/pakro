[package]
name = "mise-index"
version = "0.1.0"
edition = "2024"
description = "Package registry metadata for mise: clients, parsing, caching"
license = "MIT"
publish = false

[dependencies]
mise-store = { path = "../mise-store" }
pep440_rs = "0.7.3"
pep508_rs = "0.9.2"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "json",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "macros"] }
