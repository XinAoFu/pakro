[package]
name = "mise-index"
version = "0.1.0"
edition = "2024"
description = "Package registry metadata for mise: clients, parsing, caching"
license = "MIT"
publish = false

[dependencies]
base64 = "0.23"
mise-store = { path = "../mise-store" }
node-semver = "2"
pep440_rs = "0.7"
pep508_rs = "0.9"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "macros"] }
