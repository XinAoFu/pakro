[package]
name = "mise-resolver"
version = "0.1.0"
edition = "2024"
description = "Dependency resolution for mise packages: pure logic, no network or disk"
license = "MIT"
publish = false

[dependencies]
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
