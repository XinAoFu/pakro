[package]
name = "pakro-index"
version = "0.1.0"
edition = "2024"
description = "Package registry metadata for pakro: clients, parsing, caching"
license = "MIT"


[dependencies]
base64 = "0.23"
encoding_rs = "0.8.42"
html5ever = { version = "=0.40.1", default-features = false }
libc = "0.2.186"
mime = "0.3.17"
pakro-store = { path = "../pakro-store" }
pakro-resolver = { path = "../pakro-resolver" }
node-semver = "2"
pep440_rs = "0.7"
pep508_rs = "0.9"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
mockito = "1"
reqwest = { version = "0.13", default-features = false, features = ["gzip"] }
tokio = { version = "1.53.2", features = ["rt", "macros", "time"] }
