[package]
name = "pakro-store"
version = "0.1.0"
edition = "2024"
description = "Content-addressed package store for pakro"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }

eyre = "0.6"
uuid = { version = "1", features = ["v7"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["dir", "fs", "user"] }

[dev-dependencies]
tempfile = "3"
