# This file generates code and documentation for settings in pakro
# When this file is updated, run `cargo run -p pakro-settings --example render-schema` to update generated files
[activate_aggressive]
description = "Pushes tools' bin-paths to the front of PATH instead of allowing modifications of PATH after activation to take precedence."
docs = """
Pushes tools' bin-paths to the front of PATH instead of allowing modifications of PATH after activation to take precedence. For example, if you have the following in your `pakro.toml`:

```toml
[tools]
node = '20'
python = '3.12'
```

But you also have this in your `~/.zshrc`:

```sh
eval "$(pakro activate zsh)"
PATH="/some/other/python:$PATH"
```

What will happen is `/some/other/python` will be used instead of the python installed by pakro. This
means
you typically want to put `pakro activate` at the end of your shell config so nothing overrides it.

If you want to always use the pakro versions of tools despite what is in your shell config, set this
to `true`.
In that case, using this example again, `/some/other/python` will be after pakro's python in PATH.
"""
env = "PAKRO_ACTIVATE_AGGRESSIVE"
type = "Bool"

[activate_shims]
default = true
description = "Control whether shell activation adds managed shim directories to PATH. Explicit installation remains separate from directory selection."
env = "PAKRO_ACTIVATE_SHIMS"
type = "Bool"

[age.identity_files]
description = "List of age identity files to use for decryption (the supported `[env]` age directives)."
env = "PAKRO_AGE_IDENTITY_FILES"
optional = true
parse_env = "list_by_os_path_separator"
rust_type = "Vec<PathBuf>"
type = "ListPath"

[age.key_file]
default_docs = "~/.config/pakro/age.txt"
description = "Path to the age private key file to use for encryption/decryption: the identity for the supported `[env]` age directives."
env = "PAKRO_AGE_KEY_FILE"
optional = true
type = "Path"

[age.ssh_identity_files]
description = "List of SSH identity files to use for age decryption (the supported `[env]` age directives)."
env = "PAKRO_AGE_SSH_IDENTITY_FILES"
optional = true
parse_env = "list_by_os_path_separator"
rust_type = "Vec<PathBuf>"
type = "ListPath"

[age.strict]
default = true
description = "If true, fail when age decryption fails (including when age is not available, the key is missing, or the key is invalid). If false, skip decryption and continue in these cases."
env = "PAKRO_AGE_STRICT"
type = "Bool"

[all_compile]
description = "do not use precompiled binaries for any tool"
docs = """
Default: false unless running Alpine or NixOS. Both automatic defaults are deprecated:
affected source installs warn beginning in pakro 2026.8.0, and the defaults will be removed in
pakro 2027.8.0. Afterward, users who require source builds must set `all_compile = true`
explicitly.

Do not use precompiled binaries for all languages. Useful if running on a Linux distribution
like Alpine that does not use glibc and therefore likely won't be able to run precompiled binaries.

This needs to be set up for each language. File a ticket if you notice a language that is not
working with this config.
"""
env = "PAKRO_ALL_COMPILE"
optional = true
type = "Bool"

[always_keep_download]
description = "keep downloaded files after installation for debugging"
docs = """
Keeps downloaded archive/source files under `~/.local/share/pakro/downloads` after install/uninstall so you can inspect them
while debugging backend/plugin install behavior.

This is not a supported download cache. Some backends may skip a download when the expected file already exists, but that
behavior is backend-specific and not guaranteed. Cache `~/.local/share/pakro/installs` instead if you want to avoid
reinstalling tools in CI or offline workflows.
"""
env = "PAKRO_ALWAYS_KEEP_DOWNLOAD"
type = "Bool"

[always_keep_install]
description = "should pakro keep install files after installation even if the installation fails"
env = "PAKRO_ALWAYS_KEEP_INSTALL"
type = "Bool"

[aqua.baked_registry]
default = true
description = "Use baked-in aqua registry."
env = "PAKRO_AQUA_BAKED_REGISTRY"
type = "Bool"

[aqua.cosign]
default = true
description = "Use cosign to verify aqua tool signatures."
env = "PAKRO_AQUA_COSIGN"
type = "Bool"

[aqua.github_attestations]
default = true
description = "Enable GitHub Artifact Attestations verification for aqua tools."
docs = """
Enable/disable GitHub Artifact Attestations verification for aqua tools.
When enabled, pakro will verify the authenticity and integrity of downloaded tools
using GitHub's artifact attestation system.
"""
env = "PAKRO_AQUA_GITHUB_ATTESTATIONS"
type = "Bool"

[aqua.minisign]
default = true
description = "Use minisign to verify aqua tool signatures."
env = "PAKRO_AQUA_MINISIGN"
type = "Bool"

[aqua.registries]
description = "Aqua registry sources to load before the baked-in registry."
docs = """
Aqua registry sources to load before the baked-in registry. Each source can be a repository URL, a
direct URL to a `registry.yaml` or `registry.yml` file, or an absolute `file://` URL to a local
registry directory or file. For repository and directory sources, pakro loads `registry.yaml` from
the source root and falls back to `registry.yml` if needed.

A source that is not a URL is read as a filesystem path, resolved against the config root of the
file that declared it. This is how you reference a registry committed alongside the project:

```toml
[settings]
aqua.registries = ["registry.yaml"]
```

Path resolution applies only to sources set in a config file, since only those have a config root
to resolve against. A path given via `PAKRO_AQUA_REGISTRIES` or the CLI must be an absolute
`file://` URL.

Downloaded registries are cached according to `aqua.registry_cache_ttl`, which defaults to one
week. To refresh sooner, run `pakro cache clear`, set `aqua.registry_cache_ttl = "0s"`, or change
`PAKRO_CACHE_DIR` to use a different cache location. Local `file://` sources bypass the downloaded
source cache, so changes are read the next time the registry is loaded.

If this is set, pakro checks the configured registries in order. When `aqua.baked_registry` is
enabled, the baked-in aqua registry remains a fallback for packages missing from all configured
registries.

By default, pakro uses the baked-in official aqua registry when `aqua.baked_registry` is enabled.
If the baked registry is disabled and no registries are configured, pakro downloads the official
registry: https://github.com/aquaproj/aqua-registry
"""
env = "PAKRO_AQUA_REGISTRIES"
optional = true
parse_env = "list_by_comma"
rust_type = "Vec<String>"
type = "ListString"

[aqua.registry_cache_ttl]
default_docs = "1w"
description = "How long to cache downloaded aqua registry source files."
docs = """
How long downloaded aqua registry source files remain fresh before pakro re-downloads them.

When the downloaded source changes, pakro writes the new source cache atomically, compiles a new
source-hash-scoped registry cache, and prunes older compiled caches for that registry URL after
the new compiled cache is available.

Set to `0s` to re-download remote registries every time.
"""
env = "PAKRO_AQUA_REGISTRY_CACHE_TTL"
optional = true
type = "Duration"

[aqua.registry_url]
deprecated = "Use aqua.registries instead."
deprecated_remove_at = "2027.12.0"
deprecated_warn_at = "2026.12.0"
description = "[deprecated] URL of an aqua registry repository to fetch."
docs = """
Deprecated. Use `aqua.registries` instead.

Legacy single aqua registry repository URL to fetch before the baked-in registry.
"""
env = "PAKRO_AQUA_REGISTRY_URL"
optional = true
type = "String"

[aqua.slsa]
default = true
description = "Use SLSA to verify aqua tool signatures."
env = "PAKRO_AQUA_SLSA"
type = "Bool"

[arch]
default_docs = '"x86_64" | "aarch64" | "arm" | "loongarch64" | "riscv64"'
description = "Architecture to use for precompiled binaries."
docs = """
Architecture to use for precompiled binaries. This is used to determine which precompiled binaries
to download. If unset, pakro will use the system's architecture.
"""
env = "PAKRO_ARCH"
optional = true
type = "String"

[asdf_compat]
deprecated = "no longer supported"
description = "set to true to ensure .tool-versions will be compatible with asdf"
docs = """
Only output `.tool-versions` files in `pakro local|global` which will be usable by asdf.
This disables pakro functionality that would otherwise make these files incompatible with asdf such
as non-pinned versions.

This will also change the default global tool config to be `~/.tool-versions` instead
of `~/.config/pakro/config.toml`.
"""
env = "PAKRO_ASDF_COMPAT"
hide = true
type = "Bool"

[auto_env]
description = "Automatically enable platform config environments (unix, {os}, {os}-{arch})."
docs = """
When enabled, pakro treats the following as active config environments (in addition
to any explicit `PAKRO_ENV`): `unix` (on unix-family platforms), the OS name
(`linux`/`macos`/`windows`), and `{os}-{arch}` (e.g. `macos-arm64`, `windows-x64`,
using pakro's remapped arch names: `x86_64` -> `x64`, `aarch64` -> `arm64`).

This causes config files such as `pakro.windows.toml`, `pakro/config.macos-arm64.toml`,
or `pakro.unix.toml` to be loaded automatically, and matching `pakro.<env>.lock`
lockfiles to be selected. Platform environments have lower precedence than explicit
`PAKRO_ENV` entries; the full precedence order is `unix` < `{os}` < `{os}-{arch}` <
explicit `PAKRO_ENV` entries. Platform environments do not affect the
`{{ pakro_env }}` template variable or the `PAKRO_ENV` variable passed to subprocesses.

When unset, this currently defaults to `false`. Starting with pakro 2027.6.0 it will
default to `true`; set it to `false` to keep the old behavior, or `true` to adopt
the new behavior early.

This is an early-init setting: it must be set in `.pakrorc.toml` or via the
`PAKRO_AUTO_ENV` environment variable. Setting it in `pakro.toml` will have no effect
because config file discovery has already occurred by the time `pakro.toml` is read.

See [Configuration Environments](/configuration/environments.html) for more details.
"""
env = "PAKRO_AUTO_ENV"
optional = true
rc = true
type = "Bool"

[auto_install]
default = true
description = "Legacy non-Python missing-command installation policy. Shared Python requires an explicit installation request."
env = "PAKRO_AUTO_INSTALL"
type = "Bool"

[auto_install_disable_tools]
description = "Tools excluded from the legacy non-Python missing-command installation policy."
env = "PAKRO_AUTO_INSTALL_DISABLE_TOOLS"
optional = true
parse_env = "list_by_comma"
rust_type = "Vec<String>"
type = "ListString"

[cache_prune_age]
default = "30d"
description = "Delete files in cache that have not been accessed in this duration"
docs = """
The age of the cache before it is considered stale. pakro will occasionally delete cache files which
have not been accessed in this amount of time, and `pakro cache prune` sweeps by the same age.

Set to `0s` to keep cache files indefinitely. Both the occasional sweep and `pakro cache prune` stop
for it; the command says so rather than pruning anyway. Sub-second durations such as `500ms` are
ages like any other, not a way to disable it.

This governs the cache directories only. Cached environments expire by
[`env_cache_ttl`](/configuration/settings.html#env_cache_ttl) and are pruned on their own terms.
"""
env = "PAKRO_CACHE_PRUNE_AGE"
type = "Duration"

[cargo.binstall]
default = true
description = "Use cargo-binstall instead of cargo install if available"
docs = """
If true, pakro will use `cargo binstall` instead of `cargo install` if
[`cargo-binstall`](https://crates.io/crates/cargo-binstall) is installed and on PATH.
This makes installing CLIs with cargo _much_ faster by downloading precompiled binaries.

When `cargo-binstall` installs a prebuilt binary, Cargo build settings and `cargo install`
behavior do not affect the downloaded artifact. Set `cargo.binstall = false` to force
`cargo install` when you need Cargo settings to control the install.

When pakro invokes external `cargo-binstall`, it disables cargo-binstall's `compile` strategy.
If cargo-binstall reports that no prebuilt artifact is available (exit code 94), pakro runs
`cargo install` itself. Other cargo-binstall errors do not trigger this fallback. When
`cargo.binstall_only = true`, Cargo tools without an explicit Git source must be installed by cargo-binstall:
pakro does not fall back to `cargo install`, and options that require `cargo install` produce an
error. Explicit Git sources are unaffected because they always use `cargo install --git`.

You can install it with pakro:

```sh
pakro use -g cargo-binstall
```
"""
env = "PAKRO_CARGO_BINSTALL"
type = "Bool"

[cargo.binstall_native]
description = "Use pakro's native cargo binary installer when cargo-binstall is unavailable."
docs = """
Controls pakro's native cargo binary installer, which downloads precompiled binaries using
conventional GitHub release artifact names from the crate's linked repository or
`package.metadata.binstall` from its `Cargo.toml` when `cargo-binstall` is not installed.

- If `true`: Try pakro's native cargo binary installer first, fall back to `cargo install` if unavailable.
- If `false`: Do not use pakro's native cargo binary installer.
- If unset: Native installs are disabled for now. Starting in pakro `2027.1.0`, pakro will warn when
  a cargo package could have been installed from a native binary artifact. In pakro `2027.7.0`, unset
  will default to native binary installs and this setting will become a two-way switch.

Set `cargo.binstall = false` to force `cargo install` instead of either `cargo-binstall` or pakro's
native cargo binary installer.

This is a best-effort fast path. If neither compatible metadata nor a conventionally named GitHub
release artifact is available, or the install uses Cargo build options that would change the
resulting binary, pakro falls back to `cargo install`.
"""
env = "PAKRO_CARGO_BINSTALL_NATIVE"
optional = true
type = "Bool"

[cargo.binstall_only]
default = false
description = "Require cargo-binstall for Cargo tools without an explicit Git source. Fail if no prebuilt binary is available or if tool options require cargo install."
env = "PAKRO_CARGO_BINSTALL_ONLY"
type = "Bool"

[cargo.binstall_quickinstall]
default = false
description = "Allow cargo-binstall to use third-party cargo-quickinstall artifacts."
docs = """
If true, pakro allows the external `cargo-binstall` binary to use artifacts from
the third-party [cargo-quickinstall](https://github.com/cargo-bins/cargo-quickinstall) host. These
artifacts are separate from crate-author GitHub releases and artifacts declared in
`package.metadata.binstall`.

By default, pakro passes `--disable-strategies compile,quick-install` when invoking the external
`cargo-binstall` binary. The `compile` strategy is always disabled; setting this to `true` changes
the flag to `--disable-strategies compile`. This setting does not affect pakro's
`cargo.binstall_native` path, which does not use quickinstall.

This only controls external `cargo-binstall`'s quick-install strategy. To disable binstall, set
`cargo.binstall = false`.
"""
env = "PAKRO_CARGO_BINSTALL_QUICKINSTALL"
type = "Bool"

[cargo.registry_name]
description = "Name of the cargo registry to use."
docs = """
Packages are installed from the official cargo registry.

You can set this to a different registry name if you have a custom feed or want to use a different source.

Please follow the [cargo alternative registries documentation](https://doc.rust-lang.org/cargo/reference/registries.html#using-an-alternate-registry) to configure your registry.
"""
env = "PAKRO_CARGO_REGISTRY_NAME"
optional = true
type = "String"

[cd]
description = "Path to change to after launching pakro"
env = "PAKRO_CD"
hide = true
optional = true
type = "Path"

[ceiling_paths]
default = []
description = "Directories where pakro stops searching for config files."
docs = """
Directories where pakro stops searching for config files. By default, pakro
will search from the current directory up to the root of the filesystem.

Setting this to a list of directories will stop the search when one of
those directories is reached. Config files **in** the ceiling directory
itself are excluded—only directories below it are searched. For example,
if `PAKRO_CEILING_PATHS="/home/user"`, then `/home/user/pakro.toml` is
**not** loaded, but `/home/user/projects/myapp/pakro.toml` is.

This follows the same semantics as Git's `GIT_CEILING_DIRECTORIES`.

This is an early-init setting: it must be set in `.pakrorc.toml`, environment
variables, or CLI flags. Setting it in `pakro.toml` will have no effect because
config file discovery has already occurred by the time `pakro.toml` is read.

Paths are separated by the OS path separator when using the environment variable,
`pakro settings set`, or `pakro settings add` (`:` on Unix, `;` on Windows).
"""
env = "PAKRO_CEILING_PATHS"
parse_env = "list_by_os_path_separator"
rc = true
rust_type = "BTreeSet<PathBuf>"
type = "ListPath"

[ci]
default = "false"
description = "Set to true if running in a CI environment"
deserialize_with = "bool_string"
env = "CI"
global_only = true
hide = true
type = "Bool"

[color]
default = true
description = "Use color in pakro terminal output"
env = "PAKRO_COLOR"
type = "Bool"

[color_theme]
default = "default"
description = "Theme for interactive prompts."
enum = ["auto", "default", "charm", "base16", "catppuccin", "dracula"]
env = "PAKRO_COLOR_THEME"
type = "String"

[conda.channel]
default = "conda-forge"
description = "Default channel for conda packages."
docs = """
Default conda channel when installing packages with the conda backend.
Override per-package with `conda:package[channel=bioconda]`.

The most common channels are:
- `conda-forge` - Community-maintained packages (default)
- `bioconda` - Bioinformatics packages
- `nvidia` - NVIDIA CUDA packages
"""
env = "PAKRO_CONDA_CHANNEL"
type = "String"

[debug]
description = "Sets log level to debug"
env = "PAKRO_DEBUG"
hide = true
type = "Bool"

[default_config_filename]
default = "pakro.toml"
description = "Default project configuration filename to read."
env = "PAKRO_DEFAULT_CONFIG_FILENAME"
env_only = true
type = "String"

[default_tool_versions_filename]
default = ".tool-versions"
description = "The default .tool-versions filename read. This will not ignore .tool-versions—use override_tool_versions_filename for that. This must be an env var."
env = "PAKRO_DEFAULT_TOOL_VERSIONS_FILENAME"
env_only = true
type = "String"

[disable_backends]
default = []
description = "Backends to exclude from tool resolution and new installs, such as `asdf` or `cargo`. Existing installations are left on disk and become available again if the backend is re-enabled."
env = "PAKRO_DISABLE_BACKENDS"
parse_env = "list_by_comma"
rust_type = "Vec<String>"
type = "ListString"

[disable_default_registry]
description = "Disable the default mapping of short tool names like `php` -> `asdf:mise-plugins/asdf-php`. This parameter disables only the `asdf` backend."
env = "PAKRO_DISABLE_DEFAULT_REGISTRY"
type = "Bool"

[disable_hints]
default = []
description = "Turns off helpful hints when using different pakro features"
env = "PAKRO_DISABLE_HINTS"
parse_env = "set_by_comma"
rust_type = "BTreeSet<String>"
type = "SetString"

[disable_tools]
default = []
description = "Tools defined in pakro.toml that should be ignored"
env = "PAKRO_DISABLE_TOOLS"
parse_env = "set_by_comma"
rust_type = "BTreeSet<String>"
type = "SetString"

[disable_update_warning]
default = false
description = "Suppress warnings when a newer pakro version is available."
docs = """
Disables pakro update notices in `pakro version`, `pakro --version`, and `pakro doctor`.
Other warnings are unaffected. This does not disable `pakro self-update` or automatic updates
enabled with [`auto_update`](#auto_update).
"""
env = "PAKRO_DISABLE_UPDATE_WARNING"
type = "Bool"

[dotnet.cli_telemetry_optout]
description = "Set DOTNET_CLI_TELEMETRY_OPTOUT to opt out of .NET CLI telemetry."
docs = """
When set to true, the `DOTNET_CLI_TELEMETRY_OPTOUT` environment variable is set to `1`,
disabling .NET CLI telemetry. When set to false, it is set to `0`.

When unset (default), pakro does not set the variable and .NET uses its own default behavior.
"""
env = "PAKRO_DOTNET_CLI_TELEMETRY_OPTOUT"
optional = true
type = "Bool"

[dotnet.dotnet_root]
description = "Path to the shared .NET SDK root directory."
docs = """
All .NET SDK versions are installed side-by-side under this directory, matching .NET's native multi-version model.

By default, pakro uses `~/.local/share/pakro/dotnet-root`. Set this to override the location.
"""
env = "PAKRO_DOTNET_ROOT"
optional = true
type = "Path"

[dotnet.isolated]
default = false
description = "Install each .NET SDK version in its own isolated directory."
docs = """
When true, each SDK version is installed in its own directory under pakro's installs path,
like most other tools. `dotnet --list-sdks` will only show the active version.

When false (default), all SDK versions share a single `DOTNET_ROOT` directory and
`dotnet --list-sdks` shows all installed versions, matching .NET's native side-by-side model.
"""
env = "PAKRO_DOTNET_ISOLATED"
type = "Bool"

[dotnet.package_flags]
default = []
deprecated = "Use the `prerelease = true` tool option or the global `prereleases` setting instead."
deprecated_remove_at = "2027.11.0"
deprecated_warn_at = "2026.11.0"
description = "[deprecated] Extends dotnet search and install abilities."
docs = """
Deprecated. Use the `prerelease = true` tool option on a `dotnet:` tool, or the global
`prereleases` setting, to include pre-release versions.

This legacy setting is a list of flags to extend the search and install abilities of dotnet tools.
Because it is global, remove it before relying on `prerelease = false` per-tool opt-outs.
The only supported flag is:

- 'prerelease' : include pre-release versions in search and install
"""
env = "PAKRO_DOTNET_PACKAGE_FLAGS"
parse_env = "list_by_comma"
rust_type = "Vec<String>"
type = "ListString"

[dotnet.registry_url]
default = "https://api.nuget.org/v3/index.json"
description = "NuGet service index used to discover dotnet tool versions."
docs = """
URL of the NuGet service index used to discover tool versions. The default is
the public [NuGet service index](https://api.nuget.org/v3/index.json).

Installation runs `dotnet tool install`, which reads its own `NuGet.Config` and
credentials. Configure a private feed there as well; this setting does not add
an installation source to the dotnet CLI.
"""
env = "PAKRO_DOTNET_REGISTRY_URL"
type = "Url"

[enable_tools]
description = "Tools defined in pakro.toml that should be used; unset enables all tools and empty disables all tools"
docs = """
When unset, all tools are enabled unless they appear in
[`disable_tools`](/configuration/settings.html#disable_tools).

When explicitly set, this is the complete allowlist and `disable_tools` is not
applied. Setting this to `[]` or `PAKRO_ENABLE_TOOLS=` disables all tools.
"""
env = "PAKRO_ENABLE_TOOLS"
optional = true
parse_env = "set_by_comma"
rust_type = "BTreeSet<String>"
type = "SetString"

[env]
default = []
description = "Env to use for pakro.<PAKRO_ENV>.toml files."
docs = """
Enables profile-specific config files such as `.pakro.development.toml`.
Use this for different env vars or different tool versions in
development/staging/production environments. See
[Configuration Environments](/configuration/environments.html) for more on how
to use this feature.

Multiple envs can be set by separating them with a comma, e.g. `PAKRO_ENV=ci,test`.
They will be read in order, with the last one taking precedence.

This is an early-init setting: it must be set in `.pakrorc.toml`, environment
variables, or CLI flags (`-E`/`--env`). Setting it in `pakro.toml` will have no
effect because `PAKRO_ENV` determines which config files to load.
"""
env = "PAKRO_ENV"
parse_env = "list_by_comma"
rc = true
type = "ListString"

[env_cache]
default = false
description = "Enable caching of environment descriptions where supported. Read-only shared Python queries do not write this cache."
env = "PAKRO_ENV_CACHE"
type = "Bool"

[env_cache_ttl]
default = "1h"
description = "Lifetime of cached environment descriptions."
env = "PAKRO_ENV_CACHE_TTL"
type = "Duration"

[env_conf_d]
description = "Enable environment-specific filenames in conf.d directories."
docs = """
When enabled, files in `.pakro/conf.d` and `.config/pakro/conf.d` use environment
suffixes: `tools.development.toml` loads only when `development` is active, and
`tools.development.local.toml` is its local variant.

This behavior is opt-in during the migration period. When disabled or unset,
all non-hidden TOML files in `conf.d` continue to load unconditionally. Dots in
unconditional fragment names are deprecated; rename `node.tools.toml` to
`node-tools.toml` before pakro 2027.8.10.

This is an early-init setting: it must be set in a `pakrorc.toml` file or via the
`PAKRO_ENV_CONF_D` environment variable. Setting it in `pakro.toml` has no effect
because config file discovery has already occurred by the time `pakro.toml` is read.
"""
env = "PAKRO_ENV_CONF_D"
optional = true
rc = true
type = "Bool"

[env_file]
description = "Path to a file containing environment variables to automatically load."
env = "PAKRO_ENV_FILE"
optional = true
type = "Path"

[env_shell_expand]
default = true
description = "Controls shell-style variable expansion in env values (e.g., $FOO, ${BAR:-default})"
docs = """
Controls shell-style variable expansion in `pakro.toml` `[env]` values:

```toml
[env]
FOO = "hello"
BAR = "$FOO-world"        # "hello-world"
BAZ = "${FOO}_suffix"     # "hello_suffix"
QUX = "${UNDEF:-fallback}" # "fallback"
```

- `true` or unset — enable shell expansion
- `false` — disable shell expansion

Expansion happens after Tera template rendering, so both syntaxes can be mixed.
Undefined variables are left unexpanded (e.g., `$MISSING` stays as `$MISSING`) and produce a warning. Use `${MISSING:-}` to suppress the warning.
"""
env = "PAKRO_ENV_SHELL_EXPAND"
type = "Bool"

[erlang.compile]
description = "If true, compile erlang from source. If false, use precompiled binaries. If not set, use precompiled binaries if available."
env = "PAKRO_ERLANG_COMPILE"
optional = true
type = "Bool"

[erlang.precompiled_os]
description = "Ubuntu release target to use for precompiled Erlang builds from builds.hex.pm."
env = "PAKRO_ERLANG_PRECOMPILED_OS"
optional = true
type = "String"

[experimental]
description = "Enable experimental pakro features which are incomplete or unstable—breakings changes may occur"
docs = """
Enables experimental features. I generally will publish new features under
this config which needs to be enabled to use them. While a feature is marked
as "experimental" its behavior may change or even disappear in any release.

The idea is experimental features can be iterated on this way so we can get
the behavior right, but once that label goes away you shouldn't expect things
to change without a proper deprecation—and even then it's unlikely.

Also, I very often will use experimental as a beta flag as well. New
functionality that I want to test with a smaller subset of users I will often
push out under experimental mode even if it's not related to an experimental
feature.

If you'd like to help me out, consider enabling it even if you don't have
a particular feature you'd like to try. Also, if something isn't working
right, try disabling it if you can.
"""
env = "PAKRO_EXPERIMENTAL"
type = "Bool"

[fetch_remote_versions_cache]
default = "1h"
description = "How long to cache remote versions for tools."
docs = """
duration that remote version cache is kept for
"fast" commands (represented by PREFER_STALE), these are always
cached. For "slow" commands like `pakro ls-remote` or `pakro install`:
- if PAKRO_FETCH_REMOTE_VERSIONS_CACHE is set, use that
- if PAKRO_FETCH_REMOTE_VERSIONS_CACHE is not set, use HOURLY
"""
env = "PAKRO_FETCH_REMOTE_VERSIONS_CACHE"
type = "Duration"

[fetch_remote_versions_timeout]
aliases = ["fetch_remote_version_timeout"]
default = "20s"
description = "Timeout in seconds for HTTP requests to fetch new tool versions in pakro."
docs = """
Fast commands using `prefer_offline` cap this timeout at 3 seconds so shims and
shell activation do not block for a long time when cached data is insufficient
and the network is unavailable.
"""
env = "PAKRO_FETCH_REMOTE_VERSIONS_TIMEOUT"
type = "Duration"

[forgejo.credential_command]
default = ""
description = "Shell command to run to obtain a Forgejo token for pakro."
docs = """
When set, pakro executes this command via `sh -c` and reads the token
from stdout. The hostname is exposed as `PAKRO_CREDENTIAL_HOST`, making
the command host-aware for self-hosted Forgejo environments. This
replaces the `git credential fill` fallback and does not require
`forgejo.use_git_credentials` to be enabled.

The command should print a single token to stdout. Trailing whitespace
is trimmed.

Example: `op read "op://Private/Forgejo Token/credential"`
"""
env = "PAKRO_FORGEJO_CREDENTIAL_COMMAND"
global_only = true
type = "String"

[forgejo.fj_cli_tokens]
default = true
description = "Read Forgejo tokens from the fj CLI config."
docs = """
When enabled, pakro will read tokens from the fj CLI keys file
(`~/.local/share/forgejo-cli/keys.json` on Linux,
`~/Library/Application Support/forgejo-cli.forgejo-cli/keys.json` on macOS,
with the legacy `Cyborus.forgejo-cli` location as a fallback).
This is used as a fallback when no `FORGEJO_TOKEN` or `PAKRO_FORGEJO_TOKEN`
environment variable is set.

Set to `false` to disable this behavior.
"""
env = "PAKRO_FORGEJO_FJ_CLI_TOKENS"
type = "Bool"

[forgejo.use_git_credentials]
default = false
description = "Use git credential helpers to obtain Forgejo tokens."
docs = """
When enabled, pakro will run `git credential fill` to obtain Forgejo tokens
using the credential helpers configured in your `.gitconfig`.

This covers tokens stored in system keyrings (macOS Keychain, Windows
Credential Manager), and any other git credential helper.

Used as a last resort — after environment variables, `forgejo_tokens.toml`,
and fj CLI tokens are checked. Results are cached per host for the
duration of the session.

Set to `true` to enable this behavior.
"""
env = "PAKRO_FORGEJO_USE_GIT_CREDENTIALS"
type = "Bool"

[github.credential_command]
default = ""
description = "Shell command to run to obtain a GitHub token for pakro."
docs = """
When set, pakro executes this command via `sh -c` and reads the token
from stdout. The hostname is exposed as `PAKRO_CREDENTIAL_HOST`, making
the command host-aware for GitHub Enterprise environments. This
replaces the `git credential fill` fallback and does not require
`github.use_git_credentials` to be enabled.

The command should print a single token to stdout. Trailing whitespace
is trimmed.

Example: `op read "op://Private/GitHub Token/credential"`
"""
env = "PAKRO_GITHUB_CREDENTIAL_COMMAND"
global_only = true
type = "String"

[github.gh_cli_tokens]
default = true
description = "Read GitHub tokens from the gh CLI's hosts.yml config."
docs = """
When enabled, pakro will read OAuth tokens from the gh CLI config file
(`~/.config/gh/hosts.yml` or `$GH_CONFIG_DIR/hosts.yml`) as a fallback
when no `GITHUB_TOKEN` or `PAKRO_GITHUB_TOKEN` environment variable is set.

This supports multiple GitHub Enterprise instances since the gh CLI stores
per-host tokens.

Set to `false` to disable this behavior.
"""
env = "PAKRO_GITHUB_GH_CLI_TOKENS"
type = "Bool"

[github.github_attestations]
default = true
description = "Enable GitHub Artifact Attestations verification for github backend tools."
docs = """
Enable/disable GitHub Artifact Attestations verification for github backend tools.
When enabled, pakro will verify the authenticity and integrity of downloaded tools
using GitHub's artifact attestation system.

Attestations are only verified when the tool resolves to the public GitHub API
(`https://api.github.com`). Tools that set a custom `api_url` (e.g. GitHub
Enterprise Server) skip attestation verification automatically since GHE Server
does not implement the attestations endpoint.
"""
env = "PAKRO_GITHUB_GITHUB_ATTESTATIONS"
type = "Bool"

[github.oauth_api_url]
default = "https://api.github.com"
description = "GitHub API base URL for native OAuth token validation."
docs = """
GitHub API base URL used to validate native OAuth tokens and associate them
with the configured host.
"""
env = "PAKRO_GITHUB_OAUTH_API_URL"
type = "String"

[github.oauth_auth_url]
default = "https://github.com/login"
description = "GitHub OAuth endpoint base URL for native device-flow tokens."
docs = """
OAuth endpoint base URL used by native GitHub device flow. The default is for
github.com. Set this for GitHub Enterprise instances that support device flow.
"""
env = "PAKRO_GITHUB_OAUTH_AUTH_URL"
type = "String"

[github.oauth_client_id]
default = ""
description = "GitHub App client ID for native OAuth device-flow tokens."
docs = """
When set, pakro can create short-lived GitHub App user access tokens using
GitHub's OAuth device flow. This does not require a GitHub App private key,
client secret, personal access token, or external credential helper.

Run `pakro token github --oauth` once to authorize and cache a token. pakro will reuse
the cached token for GitHub API calls and refresh it when possible.

Inspired by [ghtkn](https://github.com/suzuki-shunsuke/ghtkn).
"""
env = "PAKRO_GITHUB_OAUTH_CLIENT_ID"
type = "String"

[github.oauth_export_env]
default = "GITHUB_TOKEN"
description = "Environment variable name to export the native GitHub OAuth token under (empty disables)."
docs = """
When `github.oauth_client_id` is configured and a cached or refreshable token
is available, pakro exports the token under this environment variable so other
tools (`gh`, `git`, `cargo`, etc.) can pick it up without an explicit
`$(pakro token github --oauth --raw)` call. Set to `GH_TOKEN` to use the gh
CLI's preferred name, or to an empty string to disable the auto-export.
"""
env = "PAKRO_GITHUB_OAUTH_EXPORT_ENV"
type = "String"

[github.oauth_open_browser]
default = true
description = "Open the browser during native GitHub OAuth device flow."
docs = """
When enabled, `pakro token github --oauth` will attempt to open GitHub's
verification URL in the default browser when the device-code flow is triggered.
"""
env = "PAKRO_GITHUB_OAUTH_OPEN_BROWSER"
type = "Bool"

[github.oauth_scopes]
default = ""
description = "OAuth scopes requested for native GitHub device-flow tokens."
docs = """
Optional OAuth scope string passed to GitHub's device-code endpoint. GitHub App
user access tokens are primarily governed by the app's permissions and
installation access, so this usually remains empty.
"""
env = "PAKRO_GITHUB_OAUTH_SCOPES"
type = "String"

[github.slsa]
default = true
description = "Enable SLSA provenance verification for github backend tools."
docs = """
Enable/disable SLSA provenance verification for github backend tools.
When enabled, pakro will verify the supply-chain integrity of downloaded tools
using SLSA provenance attestations.
"""
env = "PAKRO_GITHUB_SLSA"
type = "Bool"

[github.use_git_credentials]
default = false
description = "Use git credential helpers to obtain GitHub tokens."
docs = """
When enabled, pakro will run `git credential fill` to obtain GitHub tokens
using the credential helpers configured in your `.gitconfig`.

This covers tokens stored in system keyrings (macOS Keychain, Windows
Credential Manager), and any other git credential helper.

Used as a last resort — after environment variables, `github_tokens.toml`,
and gh CLI tokens are checked. Results are cached per host for the
duration of the session.

Set to `true` to enable this behavior.
"""
env = "PAKRO_GITHUB_USE_GIT_CREDENTIALS"
type = "Bool"

[github_attestations]
default = true
description = "Enable GitHub Artifact Attestations verification for supported tools."
docs = """
Enable/disable GitHub Artifact Attestations verification globally.
When enabled, pakro will verify the authenticity and integrity of downloaded tools
using GitHub's artifact attestation system for tools that support it (e.g., Ruby precompiled binaries).
"""
env = "PAKRO_GITHUB_ATTESTATIONS"
type = "Bool"

[github_relay.concurrency]
default = 8
description = "Maximum simultaneous GitHub relay requests (1-32); excess requests fail closed."
env = "PAKRO_GITHUB_RELAY_CONCURRENCY"
global_only = true
type = "Integer"

[github_relay.log_format]
default = "text"
description = "GitHub relay request and summary output format: text or jsonl."
env = "PAKRO_GITHUB_RELAY_LOG_FORMAT"
global_only = true
type = "String"

[github_relay.log_requests]
default = false
description = "Log sanitized GitHub relay requests on the initiating machine's stderr."
env = "PAKRO_GITHUB_RELAY_LOG_REQUESTS"
global_only = true
type = "Bool"

[github_relay.max_duration]
default = "0s"
description = "Maximum borrowed GitHub access duration; 0s means until the session ends."
env = "PAKRO_GITHUB_RELAY_MAX_DURATION"
global_only = true
type = "Duration"

[github_relay.request_timeout]
default = "5m"
description = "Total time limit for a relayed request, including response streaming."
env = "PAKRO_GITHUB_RELAY_REQUEST_TIMEOUT"
global_only = true
type = "Duration"

[gitlab.credential_command]
default = ""
description = "Shell command to run to obtain a GitLab token for pakro."
docs = """
When set, pakro executes this command via `sh -c` and reads the token
from stdout. The hostname is exposed as `PAKRO_CREDENTIAL_HOST`, making
the command host-aware for self-managed GitLab environments. This
replaces the `git credential fill` fallback and does not require
`gitlab.use_git_credentials` to be enabled.

The command should print a single token to stdout. Trailing whitespace
is trimmed.

Example: `op read "op://Private/GitLab Token/credential"`
"""
env = "PAKRO_GITLAB_CREDENTIAL_COMMAND"
global_only = true
type = "String"

[gitlab.glab_cli_tokens]
default = true
description = "Read GitLab tokens from the glab CLI config."
docs = """
When enabled, pakro will read tokens from the glab CLI config file
(`~/.config/glab-cli/config.yml` or `$GLAB_CONFIG_DIR/config.yml`) as a fallback
when no `GITLAB_TOKEN` or `PAKRO_GITLAB_TOKEN` environment variable is set.

Set to `false` to disable this behavior.
"""
env = "PAKRO_GITLAB_GLAB_CLI_TOKENS"
type = "Bool"

[gitlab.use_git_credentials]
default = false
description = "Use git credential helpers to obtain GitLab tokens."
docs = """
When enabled, pakro will run `git credential fill` to obtain GitLab tokens
using the credential helpers configured in your `.gitconfig`.

This covers tokens stored in system keyrings (macOS Keychain, Windows
Credential Manager), and any other git credential helper.

Used as a last resort — after environment variables, `gitlab_tokens.toml`,
and glab CLI tokens are checked. Results are cached per host for the
duration of the session.

Set to `true` to enable this behavior.
"""
env = "PAKRO_GITLAB_USE_GIT_CREDENTIALS"
type = "Bool"

[gix]
default = true
description = "Use gix for git operations, set to false to shell out to git."
docs = """
Use gix for git operations. This is generally faster but may not be as compatible if the
system's gix is not the same version as the one used by pakro.
"""
env = "PAKRO_GIX"
hide = true
type = "Bool"

[global_config_file]
description = "Path to the global pakro config file. Default is `~/.config/pakro/config.toml`. This must be an env var."
env = "PAKRO_GLOBAL_CONFIG_FILE"
env_only = true
optional = true
type = "Path"

[global_config_root]
description = "Path which is used as `{{config_root}}` for the global config file. Default is `$HOME`. This must be an env var."
env = "PAKRO_GLOBAL_CONFIG_ROOT"
env_only = true
optional = true
type = "Path"

[go.default_packages_file]
default = "~/.default-go-packages"
deprecated = "Default go package files are deprecated. Use tool-level postinstall hooks for packages that should be installed into every go version, or use the go: backend for CLI tools."
deprecated_remove_at = "2027.11.0"
deprecated_warn_at = "2026.11.0"
description = "Path to a file containing default go packages to install when installing go."
env = "PAKRO_GO_DEFAULT_PACKAGES_FILE"
type = "Path"

[go.download_mirror]
default = "https://dl.google.com/go"
description = "Mirror to download go sdk tarballs from."
env = "PAKRO_GO_DOWNLOAD_MIRROR"
