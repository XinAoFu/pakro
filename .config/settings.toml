Use Tera v1 instead of Tera v2 for template rendering.

This is a temporary escape hatch for users whose templates still rely on Tera v1 behavior that
cannot be fully emulated by pakro's Tera v2 compatibility helpers, such as Tera v1 macros or looser
undefined variable handling.

For shared `pakro.toml` files, prefer setting `PAKRO_TERA_V1 = true` under `[env]` while migrating.
Older pakro releases treat that as a regular environment variable instead of failing on an unknown
setting.

New templates should use Tera v2 syntax. This setting is scheduled for removal in pakro 2027.4.0.
