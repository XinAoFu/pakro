type = "Bool"

[truncate]
default = true
description = "Truncate long terminal output to fit the available width."
docs = """
Set to `false` to preserve complete values in terminal-width-aware output such as table cells and
subprocess command lines. This does not disable safety limits on captured command output, HTTP response
bodies, or history data.

AI coding agents automatically receive untruncated presentation output regardless of this setting.
Commands that support truncation also accept `--truncate` and `--no-truncate` for a one-off
override.
"""
env = "PAKRO_TRUNCATE"
type = "Bool"

[trusted_config_paths]
default = []
description = """This is a list of config paths that pakro will automatically mark as \
trusted. Any config files under these paths will be trusted without prompting. \
Set to `["/"]` to trust all config files, effectively disabling the trust mechanism. \
Paths are separated by the OS path separator when using the environment variable, \
`pakro settings set`, or `pakro settings add` (`:` on Unix, `;` on Windows)."""
env = "PAKRO_TRUSTED_CONFIG_PATHS"
global_only = true
parse_env = "list_by_os_path_separator"
rust_type = "BTreeSet<PathBuf>"
type = "ListPath"

[unix_default_file_shell_args]
default = "sh"
description = "Default shell arguments for Unix to be used for file commands. For example, `sh` for sh."
env = "PAKRO_UNIX_DEFAULT_FILE_SHELL_ARGS"
global_only = true
type = "String"

[unix_default_inline_shell_args]
default = "sh -o errexit -c"
description = "Default shell arguments for Unix to be used for inline commands. For example, `sh -c` for sh."
env = "PAKRO_UNIX_DEFAULT_INLINE_SHELL_ARGS"
global_only = true
type = "String"

[url_replacements]
description = "Map of URL patterns to replacement URLs applied to all requests."
docs = '''
Map of URL patterns to replacement URLs. This feature supports both simple hostname replacements
and advanced regex-based URL transformations for download mirroring and custom registries.

Rerouting `api.github.com` (or a repository's release and attestation API paths)
also stops pakro from using [pakro-versions](#use_versions_host) for that GitHub
metadata, so it all comes from the replacement. Rerouting only release
downloads does not.

See [URL Replacements](/url-replacements.html) for more information.
'''
env = "PAKRO_URL_REPLACEMENTS"
optional = true
parse_env = "parse_url_replacements"
type = "IndexMap<String, String>"

[use_versions_host]
default = true
description = "Set to false to disable using the upstream versions service API for version lists, public GitHub release metadata, and GitHub artifact attestations."
docs = """
Set to "false" to disable using [upstream versions service](https://mise-versions.jdx.dev) as
a shared cache for version lists, public GitHub release metadata, and GitHub artifact
attestations.

This host regularly grabs all the latest versions of core and community plugins.
It's faster than running a plugin's `list-all` command and gets around GitHub
rate limiting problems when using it. For tools distributed through public GitHub
releases, pakro also uses this host before calling GitHub's releases and artifact
attestation APIs directly. This avoids the anonymous GitHub API rate limit in
normal installs, including Docker builds and CI jobs that do not have a GitHub
token configured.

If the versions host does not have the requested metadata yet, pakro falls back to
GitHub's API. Private repositories, GitHub Enterprise, custom GitHub API URLs, and
users who disable this setting still need normal GitHub authentication when they
would otherwise exceed GitHub's rate limits.

When [`url_replacements`](#url_replacements) reroutes `api.github.com`, or a
repository's release or attestation API paths, pakro does not use this host for
that GitHub metadata. The replacement is the only source, since this host only
describes github.com itself. Rules that only reroute release downloads don't
change this, and version lists for registry tools still come from this host.

The upstream versions service itself also struggles with rate limits but you can help it to fetch more frequently by authenticating
with its [GitHub app](https://github.com/apps/mise-versions). It does not require any permissions since it simply
fetches public repository information.

See [Troubleshooting](/troubleshooting.html#new-version-of-a-tool-is-not-available) for more information.
"""
env = "PAKRO_USE_VERSIONS_HOST"
type = "Bool"

[use_versions_host_track]
default = true
description = "Send anonymous download statistics when installing tools."
docs = """
When enabled, pakro sends anonymous download statistics to the upstream versions service after
successfully installing a tool. This helps show tool popularity on [the upstream versions service](https://mise-versions.jdx.dev).

Data collected:
- Tool name and version
- OS and architecture (from User-Agent)
- Hashed IP address (for daily deduplication, not stored raw)

This is automatically disabled if `use_versions_host` is set to false.
Set to false to opt-out of anonymous statistics collection.
"""
env = "PAKRO_USE_VERSIONS_HOST_TRACK"
type = "Bool"

[verbose]
description = "Shows more verbose output such as installation logs when installing tools."
env = "PAKRO_VERBOSE"
type = "Bool"

[windows_default_file_shell_args]
default = "cmd /c"
description = "Default shell arguments for Windows to be used for file commands. For example, `cmd /c` for cmd.exe."
env = "PAKRO_WINDOWS_DEFAULT_FILE_SHELL_ARGS"
global_only = true
type = "String"

[windows_default_inline_shell_args]
default = "cmd /c"
description = "Default shell arguments for Windows to be used for inline commands. For example, `cmd /c` for cmd.exe."
env = "PAKRO_WINDOWS_DEFAULT_INLINE_SHELL_ARGS"
global_only = true
type = "String"

[windows_executable_extensions]
default = ["exe", "bat", "cmd", "com", "ps1", "vbs"]
description = "List of executable extensions for Windows. For example, `exe` for .exe files, `bat` for .bat files, and so on."
env = "PAKRO_WINDOWS_EXECUTABLE_EXTENSIONS"
parse_env = "list_by_comma"
rust_type = "Vec<String>"
type = "ListString"

[windows_powershell_no_profile]
default = true
description = "Pass -NoProfile when spawning PowerShell for supported shell operations."
env = "PAKRO_WINDOWS_POWERSHELL_NO_PROFILE"
type = "Bool"

[windows_shim_mode]
default = "file"
description = "Shim file mode for Windows. Options: `file`, `hardlink`, `symlink`."
docs = """
* values:
  * `file`: Creates a `.cmd` batch file shim and an extensionless bash script for Git Bash/Cygwin.
  * `hardlink`: Uses Windows NTFS Hardlink, required on same filesystems. Need run `pakro reshim --force` after upgrade pakro.
  * `symlink`: Uses Windows NTFS SymbolicLink. Requires Windows Vista or later with admin privileges or enabling "Developer Mode" in Windows 10/11.
"""
enum = ["file", "hardlink", "symlink"]
env = "PAKRO_WINDOWS_SHIM_MODE"
type = "String"

[yes]
description = "This will automatically answer yes or no to prompts. This is useful for scripting."
env = "PAKRO_YES"
global_only = true
type = "Bool"

[zig.use_community_mirrors]
default = true
description = "Download Zig from community-maintained mirrors"
docs = """
This setting allows pakro to fetch Zig from one of many community-maintained mirrors.

The ziglang.org website does not offer any uptime or speed guarantees, and it
recommends to use the mirrors. The mirror list is cached and allows the installs
to succeed even if the main server is unavailable.

The downloaded tarballs are always verified against Zig Software Foundation's public
key, so there is no risk of third-party modifications. Read more on [ziglang.org](https://ziglang.org/download/community-mirrors/).

If you don't have the mirror list cached locally, you can place the newline-separated
server list inside `pakro cache path`, folder `zig` as `community-mirrors.txt`.
"""
env = "PAKRO_ZIG_USE_COMMUNITY_MIRRORS"
type = "Bool"
