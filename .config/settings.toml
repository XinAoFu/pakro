This is disabled by default because each pakro release is tested with its bundled registry snapshots.
It can be useful on distributions whose pakro package updates lag behind registry changes.

The downloaded pakro registry is refreshed only for commands that allow network access and is cached
according to [`registry_cache_ttl`](#registry_cache_ttl). Fast and offline commands never refresh it.
The downloaded aqua registry uses [`aqua.registry_cache_ttl`](/configuration/settings.html#aqua.registry_cache_ttl).
"""
