type = "ListPath"

[shims.exclude]
default = []
description = "Command names pakro should never create shims for, leaving them to the system."
docs = """
Names listed here are skipped when pakro generates shims, and any existing shims with those names
are removed on the next reshim. pakro still installs and manages the tool — it just never generates a
shim for that name, so nothing in the shim directory intercepts the command and it resolves to
whatever else `PATH` provides.

This is useful when a tool's unversioned command is also provided by the OS and other software
depends on getting the system one. On Arch Linux, for example, `/usr/bin/python` is the distro
interpreter and its modules live in a matching `site-packages` directory, so a project that pins
`python` also changes which interpreter a `#!/usr/bin/env python` script gets:

    pakro settings shims.exclude=python,python3,pip,pip3

With that set, `python` and `python3` always resolve to the system interpreter, while a
version-qualified shim such as `python3.12` still resolves to the version a config selects.

Excluding `python3` means `python3 -m venv` builds a virtualenv from the system interpreter rather
than the configured one. Use the version-qualified command (for example `python3.12 -m venv`) when
you want the pakro-managed version.

This only affects the shims pakro generates, including lazy-tool bootstrap shims and
plugin-provided shims. Two things are deliberately not covered: under `pakro activate` without
`--shims` a tool's bin directory joins `PATH` as a whole, so excluded names are still visible
there; and command wrappers publish to their own directory from an explicit declaration, so an
excluded name you also declare as a wrapper still resolves to the wrapper.
"""
env = "PAKRO_SHIMS_EXCLUDE"
parse_env = "set_by_comma"
rust_type = "BTreeSet<String>"
type = "SetString"

[shims_dir]
description = "Directory containing user shims."
docs = """
The user shim farm. Lazy tools declared in user config publish their bootstrap shims here.
The directory must be absolute after `~` expansion.
`pakro reshim` may publish into a shared executable directory such as `~/.local/bin`; it only
replaces or removes entries it recognizes as pakro shims. Other pakro features filter this directory
as one PATH entry, so use a dedicated directory with activation and internal dependency lookups.
"""
env = "PAKRO_SHIMS_DIR"
global_only = true
optional = true
type = "Path"

[shorthands_file]
deprecated = "Use [plugins] in pakro.toml or ~/.config/pakro/config.toml instead (same shortname = \"backend-or-url\" rows; see https://mise.jdx.dev/configuration.html#plugins)."
deprecated_remove_at = "2026.12.0"
deprecated_warn_at = "2026.6.0"
description = "[deprecated] Path to a file containing custom tool shorthands."
docs = """
Deprecated: use `[plugins]` in pakro.toml or ~/.config/pakro/config.toml with the same `name = "url"`
rows instead of a separate file.

Use a custom file for the shorthand aliases. This is useful if you want to share plugins within
an organization.

Shorthands make it so when a user runs something like `pakro install elixir` pakro will
automatically install the [asdf-elixir](https://github.com/asdf-vm/asdf-elixir) plugin. By
default, it uses the shorthands in
[`registry/`](https://github.com/jdx/mise/blob/main/registry/).

The file should be in this toml format:

```toml
elixir = "https://github.com/my-org/mise-elixir.git"
node = "https://github.com/my-org/mise-node.git"
```

"""
env = "PAKRO_SHORTHANDS_FILE"
hide = true
optional = true
type = "Path"

