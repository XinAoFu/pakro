The HTTPS API base URL for the GitHub repository that supplies pakro releases. For GitHub Enterprise,
include the API path, such as `https://github.example.com/api/v3`.

This setting is global-only so a project configuration cannot redirect updates of the pakro binary.
"""
env = "PAKRO_SELF_UPDATE_API_URL"
global_only = true
type = "Url"

[self_update.minimum_release_age]
description = "Minimum release age for pakro itself; inherits minimum_release_age (24h by default)."
docs = """
Overrides [`minimum_release_age`](#minimum_release_age) for `pakro self-update`, automatic
updates, and update notifications. Accepts the same durations and cutoff dates. Set to
`0s` to receive releases immediately. Explicit versions bypass the delay; `--force` does not.
The `pakro self-update --minimum-release-age` flag takes precedence over this setting.

```toml
[settings]
minimum_release_age = "7d"
self_update.minimum_release_age = "24h"
```

The standalone installer also accepts `PAKRO_SELF_UPDATE_MINIMUM_RELEASE_AGE`, falling back
to `PAKRO_MINIMUM_RELEASE_AGE` and then `24h`. It reads environment variables, not TOML files,
and supports integer durations in seconds (`s`), minutes (`m`), hours (`h`), days (`d`), or
weeks (`w`). An explicit `PAKRO_VERSION` bypasses the delay.
"""
env = "PAKRO_SELF_UPDATE_MINIMUM_RELEASE_AGE"
optional = true
type = "String"

[self_update.repository]
default = ""
