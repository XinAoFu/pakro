its predecessor's releases. Release updates and installer generation remain unavailable until a
pakro publishing and verification identity is established. Update local builds or package-manager
installs through the same method used to install them.

This setting is global-only so a project configuration cannot redirect updates of the pakro binary.
"""
env = "PAKRO_SELF_UPDATE_REPOSITORY"
global_only = true
type = "String"

[shared_install_dirs]
description = "Additional existing shared tool installation directories."
