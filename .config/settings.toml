env = "PAKRO_GO_SET_GOPATH"
type = "Bool"

[go.set_goroot]
default = true
description = "Sets GOROOT=~/.local/share/pakro/installs/go/.../."
env = "PAKRO_GO_SET_GOROOT"
type = "Bool"

[go.skip_checksum]
description = "Set to true to skip checksum verification when downloading go sdk tarballs."
env = "PAKRO_GO_SKIP_CHECKSUM"
type = "Bool"

