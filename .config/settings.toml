[gpg_verify]
description = "Verify OpenPGP signatures for all tools (built-in, no external gpg required). Set to false to disable."
env = "PAKRO_GPG_VERIFY"
optional = true
type = "Bool"

[hook_env.cache_ttl]
default = "0s"
description = "Cache hook-env directory checks for this duration. Useful for slow filesystems like NFS."
docs = """
On slow filesystems (like NFS with cold cache), pakro's hook-env can be slow due to
multiple filesystem stat operations. Setting this to a positive value (e.g., "5s")
will cache the results of directory traversal and only re-check after the TTL expires.

When set to "0s" (default), no caching is performed and every hook-env call will
check the filesystem for changes. This is the safest option but slowest on NFS.

Note: When caching is enabled, newly created config files may not be detected until
the TTL expires. Use `pakro hook-env --force` to bypass the cache.
"""
env = "PAKRO_HOOK_ENV_CACHE_TTL"
type = "Duration"

[hook_env.chpwd_only]
default = false
description = "Only run hook-env checks on directory change, not on every prompt."
docs = """
When enabled, pakro will only perform full config file checks when the directory changes
(chpwd), not on every shell prompt (precmd). This significantly reduces filesystem
operations on slow filesystems like NFS.

With this enabled, changes to config files will not be detected until you change
directories. Use `pakro hook-env --force` to manually trigger a full update.

This setting is useful when:
- You're working on an NFS filesystem with slow stat operations
- Config files rarely change during a session
- You want the fastest possible shell prompt response time
"""
env = "PAKRO_HOOK_ENV_CHPWD_ONLY"
type = "Bool"

[http_download_timeout]
default = "30m"
description = "Total time allowed for an HTTP download, including retries."
docs = """
Limits the complete wall-clock time for downloading one artifact, including
all retry attempts and backoff delays. This is separate from `http_timeout`,
which detects stalled connections by timing out individual reads.

When this budget is exhausted, pakro reports the URL, active attempt, bytes
received during that attempt, and this setting name. If the server supplies a
strong ETag or Last-Modified validator, the validated partial download is kept
for the next attempt or pakro invocation.
"""
env = "PAKRO_HTTP_DOWNLOAD_TIMEOUT"
type = "Duration"

[http_retries]
default = 3
description = "Number of retries for transient HTTP failures in pakro."
docs = """
Retries are attempted only on transient errors: HTTP 5xx (server errors), 408
(Request Timeout), 429 (Too Many Requests), and network-layer failures (connect
refused, timeout, mid-stream body drops). Other 4xx responses (e.g. 404) are
treated as permanent and not retried.

Backoff schedule with jitter: ~200ms / ~1s / ~4s / ~15s. Set to 0 to disable
retries entirely.

Retries are automatically disabled for fast commands using `prefer_offline`,
including shims and shell activation. These paths make one network attempt when
cached data is insufficient, then fail or fall back immediately.

When a retry rescues a request, a warning is logged with the original error so
flaky infrastructure doesn't silently mask itself.

Artifact downloads resume from validated partial files when the server supports
byte ranges and supplies a strong ETag or Last-Modified value. Servers without
a safe validator restart downloads from the beginning. Changing the request URL
or request headers also discards the previous partial download.
"""
env = "PAKRO_HTTP_RETRIES"
type = "Integer"

[http_timeout]
default = "30s"
description = "Timeout for connecting or waiting between reads during HTTP requests."
docs = """
This timeout applies to the connection phase and to each individual response
read. The read timer resets whenever data is received, so long-running artifact
downloads are bounded separately by `http_download_timeout`.
"""
env = "PAKRO_HTTP_TIMEOUT"
type = "Duration"

[idiomatic_version_file]
deprecated = "This has been replaced with the idiomatic_version_file_enable_tools setting."
description = "Set to false to disable the idiomatic version files such as .node-version, .ruby-version, etc."
docs = """
Plugins can read the versions files used by other version managers (if enabled by the plugin)
for example, `.nvmrc` in the case of node's nvm. See [idiomatic version files](/configuration.html#idiomatic-version-files)
for more
information.

Set to "false" to disable idiomatic version file parsing.
"""
env = "PAKRO_IDIOMATIC_VERSION_FILE"
hide = true
optional = true
type = "Bool"

[idiomatic_version_file_disable_files]
default = []
description = "Specific idiomatic version files to disable for a tool."
docs = """
Use `tool:filename` pairs to exclude individual idiomatic version files without disabling
other files for the tool or other tools that read the same file.

For example, this keeps `.nvmrc` enabled for node while preventing node from reading
`devEngines.runtime` in `package.json`:

    pakro settings add idiomatic_version_file_disable_files node:package.json
"""
env = "PAKRO_IDIOMATIC_VERSION_FILE_DISABLE_FILES"
parse_env = "set_by_comma"
rust_type = "BTreeSet<String>"
type = "SetString"

[idiomatic_version_file_disable_tools]
default = []
deprecated = "This has been replaced with the idiomatic_version_file_enable_tools setting."
description = "Specific tools to disable idiomatic version files for."
env = "PAKRO_IDIOMATIC_VERSION_FILE_DISABLE_TOOLS"
hide = true
parse_env = "set_by_comma"
rust_type = "BTreeSet<String>"
type = "SetString"

[idiomatic_version_file_enable_tools]
default = []
description = "Specific tools to enable idiomatic version files for like .node-version, .ruby-version, etc."
docs = """
By default, idiomatic version files are disabled. You can enable them for specific tools with this setting.

For example, to enable idiomatic version files for node and python:

    pakro settings add idiomatic_version_file_enable_tools node
    pakro settings add idiomatic_version_file_enable_tools python

See [Idiomatic Version Files](/configuration.html#idiomatic-version-files) for more information.
"""
env = "PAKRO_IDIOMATIC_VERSION_FILE_ENABLE_TOOLS"
parse_env = "set_by_comma"
rust_type = "BTreeSet<String>"
type = "SetString"

[idiomatic_version_file_ignore_minimum_versions]
default = false
description = "Ignore idiomatic version file fields that only declare a minimum compatible version."
docs = """
Some idiomatic version files carry a *minimum* compatible version rather than the version the
project is built with. pakro used to resolve those, which is wrong -- a floor says nothing about
which version a project is developed against. They are deprecated and warn; set this to opt into
the final behavior now, which ignores them and silences the warning:

    pakro settings set idiomatic_version_file_ignore_minimum_versions true

Affects `go.mod`'s `go X.Y` directive (`toolchain goX.Y.Z` is still read) and `CMakeLists.txt`'s
`cmake_minimum_required`.

This is a temporary migration setting. In pakro 2026.11.0 the behavior becomes unconditional and
this setting is removed. See
[Idiomatic Version Files](/configuration.html#which-fields-pakro-reads).
"""
env = "PAKRO_IDIOMATIC_VERSION_FILE_IGNORE_MINIMUM_VERSIONS"
hide = true
type = "Bool"

[ignored_config_paths]
default = []
description = "This is a list of config paths that pakro will ignore."
docs = """
This is a list of config paths that pakro will ignore.

This is an early-init setting: it must be set in `.pakrorc.toml`, environment
variables, or CLI flags. Setting it in `pakro.toml` will have no effect because
config file discovery has already occurred by the time `pakro.toml` is read.

Paths are separated by the OS path separator when using the environment variable,
`pakro settings set`, or `pakro settings add` (`:` on Unix, `;` on Windows).

Relative paths in `.pakrorc.toml` are resolved from the directory containing that
file. Relative paths from the environment or CLI are resolved from the directory
where pakro was invoked. Glob patterns are supported, including recursive `**`
patterns. Paths without glob metacharacters retain directory-prefix matching.

Commands that act on every tracked config (`pakro prune`, `pakro ls --prunable`,
and the stale-version check in `pakro upgrade`) honor only the environment
variable and the global/system `pakrorc.toml` files. A project's own
`.pakrorc.toml` ignores do not hide other projects' configs from them or change
their result. Relative paths in `PAKRO_IGNORED_CONFIG_PATHS` still resolve from
the directory where pakro was invoked.
"""
env = "PAKRO_IGNORED_CONFIG_PATHS"
parse_env = "list_by_os_path_separator"
rc = true
rust_type = "BTreeSet<PathBuf>"
type = "ListPath"

[install_before]
deprecated = "Use minimum_release_age instead."
deprecated_remove_at = "2027.10.0"
deprecated_warn_at = "2026.10.0"
description = "Minimum release age / supply chain protection — only install versions released before this date"
env = "PAKRO_INSTALL_BEFORE"
hide = true
optional = true
type = "String"

[install_layout]
default_docs = "legacy"
description = "[experimental] Name installations by what they are (`identity`) instead of `installs/<tool>/<version>` (`legacy`)."
docs = """
Set to `identity` to install into `installs/<label>-<hash>/` directories named by the
installation's identity (backend, version, platform, and install-affecting options), with
`installs/<tool>/<version>` kept as a link to the installation. Shorthands such as `age` and
`aqua:FiloSottile/age` then share one install, and variants of one version that differ in an
install-affecting option coexist. Existing installs stay where they are and keep working.

This is opt-in even with `experimental = true`, which it also requires. See
[Install layout](/dev-tools/install-layout.html) for what changes and what does not.

```toml
[settings]
experimental = true
install_layout = "identity"
```
"""
enum = ["legacy", "identity"]
env = "PAKRO_INSTALL_LAYOUT"
optional = true
type = "String"

[java.shorthand_vendor]
default = "openjdk"
description = "Shorthand for Java. Used when installing Java without a vendor prefix."
env = "PAKRO_JAVA_SHORTHAND_VENDOR"
type = "String"

[jobs]
default = 8
description = "How many jobs to run concurrently such as tool installs. Values below 1 are treated as 1."
env = "PAKRO_JOBS"
rust_type = "usize"
type = "Integer"

[legacy_version_file]
default = true
deprecated = "Use idiomatic_version_file instead."
description = "Set to false to disable the idiomatic version files such as .node-version, .ruby-version, etc."
env = "PAKRO_LEGACY_VERSION_FILE"
hide = true
type = "Bool"

[legacy_version_file_disable_tools]
default = []
deprecated = "Use idiomatic_version_file_disable_tools instead."
description = "Specific tools to disable idiomatic version files for."
env = "PAKRO_LEGACY_VERSION_FILE_DISABLE_TOOLS"
hide = true
parse_env = "set_by_comma"
rust_type = "BTreeSet<String>"
type = "SetString"

[libc]
default_docs = '"glibc" | "musl"'
description = "Libc implementation to use for precompiled Linux binaries."
docs = """
Libc implementation to use for precompiled Linux binaries, for backends that publish separate
glibc and musl builds.

pakro detects the host libc, but only a musl result is carried through: a glibc host is left
unqualified rather than pinned to glibc. That distinction matters when a backend selects an asset
by name, because an unqualified target can still match a musl artifact on a glibc host. Set this
to `gnu` when you need the glibc build specifically — for example when a package publishes both
glibc and musl builds and the musl one misbehaves:

```toml
[settings]
libc = "gnu"
```

`gnu` is accepted as an alias for `glibc`.
"""
enum = ["glibc", "gnu", "musl"]
env = "PAKRO_LIBC"
optional = true
type = "String"

[libgit2]
default = true
description = "Use libgit2 for git operations, set to false to shell out to git."
docs = """
Use libgit2 for git operations. This is generally faster but may not be as compatible if the
system's libgit2 is not the same version as the one used by pakro.
"""
env = "PAKRO_LIBGIT2"
hide = true
type = "Bool"

[locked]
default = false
description = "Require lockfile URLs to be present during installation."
docs = """

> [!NOTE]
> This setting requires [lockfile](#lockfile) to be enabled.

When enabled, `pakro install` will fail if tools don't have pre-resolved URLs in the lockfile
for the current platform. This prevents API calls to GitHub, aqua registry, etc. and ensures
reproducible installations.

This is useful in CI/CD environments where you want to:
- Avoid GitHub API rate limits
- Ensure deterministic builds using pre-resolved URLs
- Fail fast if the lockfile is incomplete

To generate lockfile URLs, run:

```sh
pakro lock
```

Equivalent to passing `--locked` to `pakro install`.
"""
env = "PAKRO_LOCKED"
type = "Bool"

[locked_scopes]
default = ["global", "project", "system"]
description = "Config scopes where invocation-wide locked mode is enforced."
docs = """
Restrict invocation-wide locked mode (`--locked`, `PAKRO_LOCKED=1`, or
`locked = true`) to tools originating in the selected config scopes. Valid
scopes are `project`, `global` (the user config), and `system`.

For example, distributions that declare rolling tools in system config can
exclude those tools while retaining strict locking for project and user-global
tools:

```toml
[settings]
locked_scopes = ["project", "global"]
```

To lock only project tools, set `locked_scopes = ["project"]`. Explicit tool
arguments and environment-supplied tool versions remain subject to
invocation-wide locked mode because they do not belong to a config scope.
Config-root policy set with `[tool_config] locked = true` is always enforced,
even when that scope is absent from this list. Excluding a scope relaxes locked
mode for that scope; it does not prevent pakro from reading an existing lockfile.

This is a global-only setting so project configuration cannot weaken a user's
locked-mode policy. Set it in user-global or system config, or with
`PAKRO_LOCKED_SCOPES`.
"""
enum = ["project", "global", "system"]
env = "PAKRO_LOCKED_SCOPES"
global_only = true
parse_env = "set_by_comma"
rust_type = "BTreeSet<String>"
type = "SetString"

[locked_verify_provenance]
default = false
description = "Re-verify provenance at install time even when the lockfile already has provenance."
docs = """
When enabled, `pakro install` will re-verify provenance (SLSA, cosign, minisign,
GitHub artifact attestations) at install time even when the lockfile already
contains both a checksum and a provenance entry.

By default, when a lockfile has a checksum and provenance type recorded,
`pakro install` trusts the lockfile and skips re-verification to avoid redundant
API calls (e.g., to GitHub). Enabling this setting forces re-verification every
time, which provides stronger security guarantees at the cost of additional
network requests.

This is automatically enabled when `paranoid` is set to `true`.
"""
env = "PAKRO_LOCKED_VERIFY_PROVENANCE"
type = "Bool"

[lockfile]
description = "Create and read lockfiles for tool versions."
docs = """
Read/update lockfiles for tool versions. This is useful when you'd like to have loose versions in pakro.toml like this:

```toml
[tools]
node = "22"
gh = "latest"
```

But you'd like the versions installed to be consistent within a project. When this is enabled, pakro will update pakro.lock
files next to pakro.toml files containing pinned versions. When installing tools, pakro will reference this lockfile if it exists and this setting is enabled to resolve versions.

When set to `true` in a TOML settings file, project lockfiles are created and maintained automatically. When unset, existing lockfiles are read and updated but new lockfiles are not created. `PAKRO_LOCKFILE=1` retains this existing-lockfile behavior for backwards compatibility. To generate one explicitly, run:

```sh
pakro lock
```

Global lockfiles are only created with `pakro lock --global`.

The lockfile is named the same as the config file but with `.lock` instead of `.toml` as the extension, e.g.:

- `pakro.toml` -> `pakro.lock`
- `pakro.local.toml` -> `pakro.local.lock`
- `.config/pakro.toml` -> `.config/pakro.lock`

When set to `true`, project lockfiles are created, read, and written. When set to `false`, lockfiles are explicitly disabled—this
will cause an error if `locked = true` is also set, since locked mode requires reading lockfiles.
When unset (the default), existing lockfiles are read and written, but new lockfiles are not created.
"""
env = "PAKRO_LOCKFILE"
optional = true
type = "Bool"

[lockfile_mode]
default_docs = "merge"
description = "Choose incremental merging or complete lockfile generation."
docs = """
Set to `generate` to trial complete lockfile generation and concurrent locking during
installation. The initial default is `merge`. This setting does not enable lockfile
creation: use `lockfile = true` or `pakro lock` for that.
"""
enum = ["merge", "generate"]
env = "PAKRO_LOCKFILE_MODE"
optional = true
type = "String"

[lockfile_platforms]
description = "Platforms to target in lockfile operations."
docs = """
Restricts which platforms are included when auto-locking (triggered by `pakro install`/`pakro use`)
or when running `pakro lock` without `--platform`. By default (unset), pakro targets all common
platforms (linux-x64, linux-x64-musl, linux-arm64, linux-arm64-musl, macos-x64, macos-arm64,
windows-x64) plus the current platform.

Setting this avoids resolving checksums/URLs for platforms you don't need, keeping lockfiles
smaller and `pakro install`/`pakro use` faster.

Does NOT override explicit `pakro lock --platform` flags.

```toml
[settings]
lockfile_platforms = ["macos-arm64", "linux-x64"]
```

The current platform is always included in addition to any configured platforms.

Platform format: `os-arch` or `os-arch-qualifier` (e.g., `linux-x64`, `linux-x64-musl`, `macos-arm64`).
"""
env = "PAKRO_LOCKFILE_PLATFORMS"
optional = true
parse_env = "list_by_comma"
rust_type = "Vec<String>"
type = "ListString"

[log_level]
default = "info"
description = "Show more/less output."
enum = ["trace", "debug", "info", "warn", "error"]
env = "PAKRO_LOG_LEVEL"
hide = true
type = "String"

[minimum_release_age]
default_docs = "24h"
description = "Minimum release age / supply chain protection — only install versions older than this threshold"
docs = """
Filter tool versions by release date to limit supply chain risk. Similar to Renovate's
[minimum release age](https://docs.renovatebot.com/key-concepts/minimum-release-age/),
this ensures newly published versions are ignored until they've been available for a
configurable amount of time — giving the community time to discover compromised releases.
This name matches pnpm's `minimumReleaseAge` setting, though pakro accepts both relative
durations and absolute cutoff dates.

Supports:

- Relative durations: `7d` (7 days ago), `90d` (90 days ago), `6mo` (6 months ago), `1y` (1 year ago)
- Absolute dates: `2024-06-01`, `2024-06-01T12:00:00Z`

Example:

```toml
[settings]
minimum_release_age = "7d"  # default is 24h
```

Capability depends on what each backend can report or pass through:

- Top-level version filtering: applies to fuzzy version requests when the backend provides release
  timestamps, such as `aqua:`, `cargo:`, `github:`, `gitlab:`, `go:`, and many
  core tools. Versions without timestamps are included by default.

Backends may select an older top-level tool version, but this setting does not constrain
dependencies fetched by the tool's installer/compiler.

**Behavior**: For most backends, this filter only applies when resolving fuzzy version requests
like `node@20` or `latest`. Explicitly pinned versions like `node@22.5.0` are not filtered,
allowing you to selectively use newer versions for specific tools while keeping others behind the
cutoff date. Versions selected from `pakro.lock` are also not filtered because the lockfile records
an already-reviewed top-level selection that must remain reproducible.

Defaults to `24h`. Set `minimum_release_age = "0s"` to effectively disable the delay.

Can be overridden with the `--minimum-release-age` CLI flag or per-tool with the `minimum_release_age` tool option.

```toml
[tools.trivy]
version = "latest"
minimum_release_age = "7d"  # override for this tool only
```
"""
env = "PAKRO_MINIMUM_RELEASE_AGE"
optional = true
type = "String"

[minimum_release_age_excludes]
default = []
description = "Tools and backends to exclude from the global/default minimum_release_age setting"
docs = """
Exclude tools or backends from the global/default [`minimum_release_age`](#minimum_release_age) setting.
This is useful for tools where newly published releases are time-sensitive.

Exclusions match any of:

- Backend wildcard: `aqua:*`, `github:*`
- Registry tool shorthand: `trivy`, `node`
- Full backend ID: `github:BurntSushi/ripgrep`, `aqua:aquasecurity/trivy`

Example:

```toml
[settings]
minimum_release_age = "7d"
minimum_release_age_excludes = ["trivy", "github:*"]
```

This excludes matching tools from the global setting and built-in default. A per-tool `minimum_release_age` option
or the `--minimum-release-age` CLI flag still applies to matching tools.

Values from multiple configuration files are merged and deduplicated, so a project can add exclusions without
repeating exclusions from the global configuration. The environment variable replaces the merged file value.
"""
env = "PAKRO_MINIMUM_RELEASE_AGE_EXCLUDES"
merge = "append_unique"
parse_env = "list_by_comma"
type = "ListString"

[netrc]
default = true
description = "Use a netrc file for HTTP Basic authentication."
docs = """
When enabled, pakro will read credentials from the netrc file and apply
HTTP Basic authentication for matching hosts. This is useful for accessing
private artifact repositories like Artifactory or Nexus.

On Unix/macOS, the default path is `~/.netrc`.
On Windows, pakro looks for `%USERPROFILE%\\_netrc` first, then falls back to `%USERPROFILE%\\.netrc`.

The netrc file format is:

```
machine artifactory.example.com
  login myuser
  password mytoken
```

You can also specify a custom netrc file path using the `netrc_file` setting.
"""
env = "PAKRO_NETRC"
type = "Bool"

[netrc_file]
description = "Path to the netrc file to use for HTTP Basic authentication."
docs = """
Override the default netrc file path. This is useful if you want to use a
different netrc file for pakro or if your netrc file is in a non-standard location.
"""
env = "PAKRO_NETRC_FILE"
optional = true
type = "Path"

[no_env]
description = "Do not load environment variables from config files."
env = "PAKRO_NO_ENV"
optional = true
type = "Bool"

[no_hooks]
description = "Do not execute hooks from config files."
env = "PAKRO_NO_HOOKS"
optional = true
type = "Bool"

[node.apply_patches]
description = "A list of patch files or URLs to apply to node source."
docs = """
Newline-separated list of patch files or URLs, applied to the extracted node source before
`./configure` runs.

They only reach a source build. `node.compile = true` forces one; failing that, they still apply
whenever no precompiled archive exists for the version and pakro falls back to compiling on its own.
When a precompiled binary is what gets installed, pakro warns rather than dropping the patches
silently.
"""
env = "PAKRO_NODE_APPLY_PATCHES"
optional = true
type = "String"

[node.cflags]
description = "Additional CFLAGS options (e.g., to override -O3)."
env = "PAKRO_NODE_CFLAGS"
optional = true
type = "String"

[node.compile]
description = "Compile node from source."
env = "PAKRO_NODE_COMPILE"
optional = true
type = "Bool"

[node.concurrency]
default_docs = "Number of physical CPUs (unless ninja is enabled)"
description = "How many jobs should be used in compilation."
docs = """
Number of parallel jobs for node compilation. Defaults to the number of physical CPU cores when using make. When ninja is enabled, this defaults to unset (ninja handles concurrency automatically).
"""
env = "PAKRO_NODE_CONCURRENCY"
optional = true
type = "Integer"

[node.configure_opts]
description = "Additional ./configure options."
env = "PAKRO_NODE_CONFIGURE_OPTS"
optional = true
type = "String"

[node.corepack]
description = "Installs the default corepack shims after installing any node version."
env = "PAKRO_NODE_COREPACK"
type = "Bool"

[node.default_packages_file]
default_docs = "~/.default-npm-packages"
deprecated = "Default npm package files are deprecated. Use tool-level postinstall hooks for packages that should be installed into every node version, or declare project packages with native [packages] tables."
deprecated_remove_at = "2027.11.0"
deprecated_warn_at = "2026.11.0"
description = "Path to a file containing default npm packages to install."
docs = """
Path to a file containing packages to install with npm after installing a new Node.js version.
Defaults to `~/.default-npm-packages`. Also checks `~/.default-nodejs-packages` and `~/.default-node-packages` for backwards compatibility.

Format: one package per line, with optional version specifier:
```
lodash
typescript@latest
@types/node@^20
```
"""
env = "PAKRO_NODE_DEFAULT_PACKAGES_FILE"
optional = true
type = "Path"

[node.flavor]
description = "Install a specific node flavor like glibc-217 or musl. Use with unofficial node build repo."
env = "PAKRO_NODE_FLAVOR"
optional = true
type = "String"

[node.gpg_verify]
description = "Verify OpenPGP signatures for node (built-in, no external gpg required). Set to false to disable."
env = "PAKRO_NODE_GPG_VERIFY"
optional = true
type = "Bool"

[node.make]
description = "Make command to use."
env = "PAKRO_NODE_MAKE"
optional = true
type = "String"

[node.make_install_opts]
description = "Additional make install options."
env = "PAKRO_NODE_MAKE_INSTALL_OPTS"
optional = true
type = "String"

[node.make_opts]
description = "Additional make options."
env = "PAKRO_NODE_MAKE_OPTS"
optional = true
type = "String"

[node.mirror_url]
description = "Mirror to download node tarballs from."
env = "PAKRO_NODE_MIRROR_URL"
optional = true
type = "Url"

[node.ninja]
default_docs = "Auto-detected: true if ninja is on PATH"
description = "Use ninja instead of make to compile node."
docs = """
If true, use ninja build system instead of make for faster compilation.
Defaults to true if `ninja` is found on PATH, false otherwise.

Ninja is generally faster than make for incremental builds.
"""
env = "PAKRO_NODE_NINJA"
optional = true
type = "Bool"

[node.nodenv_root]
default = "~/.nodenv"
description = "Directory for nodenv."
env = "NODENV_ROOT"
type = "Path"

[node.npm_shim]
default = true
description = "Install a bash wrapper at bin/npm that triggers `pakro reshim` after `npm install -g`. Disable to let corepack or a global `npm install -g npm@...` manage `bin/npm` directly."
env = "PAKRO_NODE_NPM_SHIM"
type = "Bool"

[node.nvm_dir]
default = "~/.nvm"
description = "Directory for nvm."
env = "NVM_DIR"
type = "Path"

[node.verify]
default = true
description = "Verify the downloaded assets using GPG."
env = "PAKRO_NODE_VERIFY"
type = "Bool"

[not_found_auto_install]
default = true
description = "Legacy non-Python missing-command installation policy; shared Python missing commands never authorize installation."
env = "PAKRO_NOT_FOUND_AUTO_INSTALL"
type = "Bool"

[not_found_auto_install_registry]
default = false
description = "Automatically install an unconfigured tool when its registry bin matches a missing command."
docs = """
When the command-not-found handler cannot install a configured tool, look for a matching binary in
pakro's registry. If exactly one enabled tool provides the command, install its latest version and
add it to the global config, as with `pakro use --global TOOL`. Ambiguous matches are skipped.

This is disabled by default. [`not_found_auto_install`](#not_found_auto_install) and
[`auto_install_disable_tools`](#auto_install_disable_tools) also apply.
"""
env = "PAKRO_NOT_FOUND_AUTO_INSTALL_REGISTRY"
type = "Bool"

[not_found_system_fallback]
default = true
description = "Set to false to stop shims from falling back to a same-named binary found elsewhere on PATH."
docs = """
When a shim cannot resolve a pakro-managed tool, it falls back to the first same-named executable found on
`PATH` outside the shims directory. That is useful for tools you also want to work outside of pakro, but it
means a configured-but-uninstalled version can silently run an unrelated system binary instead of erroring
— common for tools the OS also ships, like `python3`.

Set to false, alongside [`not_found_auto_install`](#not_found_auto_install), to make an unresolvable shim
fail loudly instead.
"""
env = "PAKRO_NOT_FOUND_SYSTEM_FALLBACK"
type = "Bool"


[offline]
description = "Disable all HTTP requests. Tools will only use locally cached data."
docs = """
When enabled, pakro will never make HTTP requests. This is useful for air-gapped environments,
VPN issues, or when you want to ensure pakro only uses locally cached data.

Note: Commands like `hook-env`, `activate`, `exec`, `env`, and shims already avoid most network
requests via the `prefer_offline` behavior. Set `offline = true` to completely block all
HTTP requests for commands like `pakro install` or `pakro ls-remote` as well.

Can also be set with the `--offline` CLI flag.
"""
env = "PAKRO_OFFLINE"
type = "Bool"

[os]
default_docs = '"linux" | "macos" | "windows"'
description = "OS to use for precompiled binaries."
env = "PAKRO_OS"
optional = true
type = "String"

[override_config_filenames]
default = []
description = "If set, pakro will ignore default config files like `pakro.toml` and use these filenames instead."
docs = """
If set, pakro will ignore default config files like `pakro.toml` and use these
filenames instead.

This is an early-init setting: it must be set in `.pakrorc.toml`, environment
variables, or CLI flags. Setting it in `pakro.toml` will have no effect because
config file discovery has already occurred by the time `pakro.toml` is read.
"""
env = "PAKRO_OVERRIDE_CONFIG_FILENAMES"
parse_env = "list_by_colon"
rc = true
type = "ListString"

[override_tool_versions_filenames]
default = []
description = "If set, pakro will ignore .tool-versions files and use these filenames instead. Can be set to `none` to disable .tool-versions."
docs = """
If set, pakro will ignore .tool-versions files and use these filenames instead.
Can be set to `none` to disable .tool-versions entirely.

This is an early-init setting: it must be set in `.pakrorc.toml`, environment
variables, or CLI flags. Setting it in `pakro.toml` will have no effect because
config file discovery has already occurred by the time `pakro.toml` is read.
"""
env = "PAKRO_OVERRIDE_TOOL_VERSIONS_FILENAMES"
parse_env = "list_by_colon"
rc = true
type = "ListString"

[packslip.exec]
default = false
description = "Run a tool's own command at install time to produce a resource its packslip offers only as an exec entry, such as an agent skill."
docs = """
Allow resource generation that runs the installed vendor executable during
installation, such as a command that prints an agent skill's `SKILL.md`.
Fetched files do not need this setting.

On-demand shell completions are separate: pakro may run a declared completion
command when the shell requests it, or when you run `pakro completion --tool`,
and caches successful output per version, executable, and shell. Disabling
this setting does not disable on-demand completion generation.

See [completions and skills](/dev-tools/packslip-resources.html) for setup,
source selection, and execution limits.
"""
env = "PAKRO_PACKSLIP_EXEC"
type = "Bool"

[packslip.stampers]
description = "Hosts whose signed stamp lists say which packslip releases may be installed, each with its pin."
docs = """
A stamping host, a registry, a mirror, or a scanning service, publishes a
signed release list per vendor project at
`https://<host>/.well-known/packslip/<project>.json`, naming the versions it
checked and what it checked. When this setting names hosts, pakro installs a
packslip tool only at a version one of them lists: a version no trusted host
stamped is not offered and not installed, however valid the vendor's own
manifest is. Any one host's non-yanked approval suffices: one host withdrawing
its approval does not veto another's. A vendor withdrawal still excludes the
version regardless of stamps. Each accepted list must remain available,
unexpired, and at or above its highest previously accepted sequence.

Each entry is `host=PIN`, where the pin is the minisign-format public key the
host signs with, the path of that `.pub` file, or, for a host that signs
keylessly from GitHub, an identity prefix such as
`https://github.com/org/registry/`:

```toml
[settings.packslip]
stampers = [
  "registry.example.com=/path/to/stamper.pub",
  "stamps.example.com=https://github.com/example/stamps/",
]
```

A tool whose options say `trust = "vendor"` takes the vendor's own manifest
under the vendor's pin, with no stamp:

```toml
[tools]
"packslip:github.com/jdx/mise" = { version = "latest", trust = "vendor" }
```

Unset, no stamps are required. The example hosts and key path are placeholders;
configure a real service and a pin you trust. A stamp never replaces verification
of the vendor signature. See [stamps](/dev-tools/backends/packslip.html#stamps).
"""
env = "PAKRO_PACKSLIP_STAMPERS"
optional = true
parse_env = "list_by_comma"
rust_type = "Vec<String>"
type = "ListString"

[paranoid]
description = "Enables extra-secure behavior."
docs = """
Enables extra-secure behavior. See [Paranoid](/paranoid.html).
"""
env = "PAKRO_PARANOID"
global_only = true
type = "Bool"

[pin]
description = "Legacy non-Python version selection preference. Shared Python requires complete exact versions."
env = "PAKRO_PIN"
type = "Bool"


[plugin_autoupdate_last_check_duration]
default = "7d"
description = "How long to wait before updating plugins automatically (note this isn't currently implemented)."
env = "PAKRO_PLUGIN_AUTOUPDATE_LAST_CHECK_DURATION"
type = "String"

[prefer_offline]
description = "Prefer locally cached data over remote fetches when possible."
docs = """
When enabled, pakro will prefer locally cached data and avoid remote version fetching when
possible. Unlike `offline`, this still allows network requests as a fallback.

This is automatically enabled for fast commands like `hook-env`, `activate`, `exec`, `env`,
`ls`, `current`, `where`, `which`, and shims.
"""
env = "PAKRO_PREFER_OFFLINE"
type = "Bool"

[prereleases]
description = "Include pre-release versions in `ls-remote`, `latest` resolution, and fuzzy matching for all tools."
docs = """
By default, releases flagged `prerelease: true` on GitHub/Forgejo are excluded from `pakro ls-remote`,
`latest` resolution, and fuzzy version matching. Per-tool opt-in is available via the
`prerelease = true` tool option (currently honored by the `github:`, `forgejo:`, `aqua:`, and `dotnet:` backends).

Set `prereleases = true` (or `PAKRO_PRERELEASES=1`) to opt in globally for every tool —
equivalent to setting `prerelease = true` on each one. Useful for build pipelines that
mirror the full release catalog (e.g. https://github.com/jdx/mise-versions) and for users
who want pre-release tags to surface in `pakro ls-remote` without per-tool config.

Can also be set with the `--prerelease` flag on `pakro ls-remote`.

Has no effect on backends that don't carry an upstream pre-release flag (e.g. `github_tag`
version source). Draft releases are always excluded.
"""
env = "PAKRO_PRERELEASES"
type = "Bool"

[profile]
deprecated = "Use PAKRO_ENV instead."
