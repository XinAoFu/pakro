# To test this snap package on your local Linux machine,
# Install snapcraft (`snap install snapcraft --classic`) and
# run the following commands:
#
# ```shell
# (cd packaging/snap && snapcraft pack)
# snap install ./pakro_20xx.xx.x_amd64.snap --dangerous --classic
# ```

name: pakro
title: pakro
version: "2026.10.3"
summary: Dev tools, env vars, and tasks in one CLI
description: |
  pakro prepares your development environment before each command runs.

  - Install and switch between dev tools like node, python, cmake, terraform, and hundreds more.
  - Load environment variables for each project directory.
  - Define and run tasks used to build, test, lint, and deploy projects.

license: MIT
grade: stable
confinement: classic

platforms:
  amd64:
  arm64:
  armhf:

base: core24

parts:
  pakro:
    source: "../.."
    source-type: local

    plugin: rust
    rust-channel: stable

    build-packages:
      - cmake
      - libssl-dev
    build-attributes:
      - enable-patchelf

  update-instructions:
    plugin: dump
    source: ../snapcraft
    source-type: local
    organize:
      "pakro-self-update-instructions.toml": lib/
    stage:
      - lib/

apps:
  pakro:
    command: bin/pakro
