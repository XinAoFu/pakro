#:schema ./src/schema/pakro.json
min_version = "2026.9.7"

[env]
CROSS_CONFIG = "{{config_root}}/packaging/config/Cross.toml"
_.path = ["./target/debug"]

[tools]
mr-boxington = { version = "latest", minimum_release_age = "0s" }
tak = { version = "latest", minimum_release_age = "0s" }
age = "latest"
aube = { version = "latest", minimum_release_age = "0s" }
cargo-binstall = "latest"
communique = { version = "latest", minimum_release_age = "0s" }
cargo-insta = "latest"
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
git-cliff = "latest"
gh = "latest"
hk = { version = "latest", minimum_release_age = "0s" }
jq = "latest"
shellcheck = "latest"
shfmt = "latest"
taplo = "latest"
usage = { version = "latest", minimum_release_age = "0s" }
wait-for-gh-rate-limit = { version = "latest", minimum_release_age = "0s" }
sops = "latest"
node = "24"

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[task_config]
includes = [
  ".config/tasks.toml",
  "src/dev/tasks",
  "tests/tasks",
  "runtimes/tasks",
  "packaging/tasks",
]

# Instruction-counted benchmarks (see tests/benchmarks/tak.toml). Needs valgrind for the counts;
# without it tak reports wall clock only and says so, so this still works on
# macOS where there is no usable cachegrind.
#
# `--release`, not `--profile serious`: LTO roughly triples the build for a
# number whose absolute value does not matter. What matters is that every
# measurement in a series is built the same way, and the series is partitioned
# on runner class so a change of build profile would start a fresh one anyway.
[tasks.perf]
dir = "{{config_root}}"
# PAKRO_OFFLINE keeps `ls`, `env` and `hook-env` off the network. Without it they
# log HTTP warnings and their instruction counts move with whatever the registry
# happened to answer. Ignoring the repository config keeps its development tools
# out of the fixture so editing this file does not change a benchmark's input.
env = { PAKRO_OFFLINE = "1", PAKRO_IGNORED_CONFIG_PATHS = "{{config_root}}/pakro.toml" }
run = [
  "mbx build --release",
  "tak run --config {{config_root}}/tests/benchmarks/tak.toml",
]

# Same measurement, appended to refs/notes/tak for this commit. Run by the
# `perf` workflow on every push to main; the notes are the history. Safe to run
# locally — nothing leaves the machine until `tak push`.
[tasks."perf:record"]
dir = "{{config_root}}"
env = { PAKRO_OFFLINE = "1", PAKRO_IGNORED_CONFIG_PATHS = "{{config_root}}/pakro.toml" }
run = [
  "mbx build --release",
  "tak run --config {{config_root}}/tests/benchmarks/tak.toml --record",
]

# End-to-end task artifact cache phases. The harness generates an isolated
# large fixture so benchmark inputs never need to be checked into the repo.
[tasks."perf:task-cache"]
dir = "{{config_root}}"
run = ["cargo build --release", "bash tests/benchmarks/task-cache/benchmark.sh"]
