[package]
name = "pakro-bootstrap"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Bootstrap resource planning and dependency ordering for pakro"
readme = "README.md"

[dependencies]
base64 = "0.23"
eyre = "0.6"
indexmap = "2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
