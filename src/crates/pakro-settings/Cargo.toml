[package]
name = "pakro-settings"
version = "2026.9.0"
edition = "2024"
license = "MIT"
description = "Settings types and the process-wide settings cache for pakro"
include = ["src/**/*", "examples/**/*", "build.rs", "settings.toml"]

[dependencies]
confique = { version = "0.4", default-features = false }
eyre = "0.6"
indexmap = { version = "2", features = ["serde"] }
itertools = "0.15"
log = "0.4"
pakro-cache-core = { path = "../pakro-cache-core", version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
toml = { version = "1", features = ["parse", "preserve_order"] }

[build-dependencies]
heck = "0.5"
indexmap = "2"
toml = "1"

# heck is used only by build.rs; pakro-cache-core only by the code build.rs
# generates, which cargo-machete does not scan.
[package.metadata.cargo-machete]
ignored = ["heck", "pakro-cache-core"]
